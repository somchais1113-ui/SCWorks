name: Build SC Drive v1.9.1 GForce RPM UI

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/sc-drive-v191-gforce-rpm-ui.yml'
      - 'build-assets/v191/v191-bundle.tar.gz.b64'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sc-drive-v191-gforce-rpm-ui
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sc-drive-apk-build
          fetch-depth: 1

      - name: Publish running pointer
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build-status
          cat > build-status/sc-drive-v191-latest.txt <<EOF
          STATUS=running
          RUN_ID=$GITHUB_RUN_ID
          SOURCE_SHA=$GITHUB_SHA
          ARTIFACT_NAME=SC-Drive-v1.9.1-GForce-RPM-UI-CANDIDATE
          APK_NAME=SC_Drive-v1.9.1-GForce-RPM-UI-CANDIDATE.apk
          APK_SHA256=
          EOF
          git config user.name 'SC Drive Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add build-status/sc-drive-v191-latest.txt
          git commit -m 'publish v1.9.1 running pointer [skip ci]' || true
          git push origin HEAD:sc-drive-apk-build || true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Reconstruct v1.9.0 source
        shell: bash
        run: |
          set -euxo pipefail
          git fetch --depth=1 origin main
          git show origin/main:.github/workflows/sc-drive-v189-inspect-media.yml > /tmp/inspect-v188.yml
          ruby -ryaml -e 'y=YAML.load_file(ARGV[0]); n=ARGV[1]; s=y["jobs"]["inspect"]["steps"].find{|x|x["name"]==n}; abort("missing #{n}") unless s&&s["run"]; print s["run"]' /tmp/inspect-v188.yml 'Reconstruct v1.8.8 source' >/tmp/reconstruct-v188.sh
          bash /tmp/reconstruct-v188.sh
          mkdir -p build-assets/v190
          git show origin/main:build-assets/v190/drive_dynamics_panel.dart > build-assets/v190/drive_dynamics_panel.dart
          git show origin/main:build-assets/v190/apply-v190.sh > build-assets/v190/apply-v190.sh
          chmod +x build-assets/v190/apply-v190.sh
          bash build-assets/v190/apply-v190.sh
          grep -n '^version: 1.9.0+35' scdrive-app/pubspec.yaml

      - name: Apply v1.9.1 G-force RPM and UI refinements
        shell: bash
        run: |
          set -euxo pipefail
          git show origin/main:build-assets/v191/v191-bundle.tar.gz.b64 | tr -d '\r\n' | base64 --decode > /tmp/v191.tar.gz
          echo '776d0546860259ac9d263d12ddd534b2904ff9800e5e7c3cdfbada3d245b0a89  /tmp/v191.tar.gz' | sha256sum -c -
          tar -xzf /tmp/v191.tar.gz
          chmod +x build-assets/v191/apply-v191.sh
          bash build-assets/v191/apply-v191.sh

      - name: Source gates
        shell: bash
        run: |
          set -euxo pipefail
          grep -n '^version: 1.9.1+36' scdrive-app/pubspec.yaml
          grep -q 'SPEED + RPM TRACE' scdrive-app/lib/features/head_unit/drive_dynamics_panel.dart
          grep -q 'RPM OBD' scdrive-app/lib/features/head_unit/drive_dynamics_panel.dart
          grep -q 'rpmValid' scdrive-app/lib/features/head_unit/drive_dynamics_panel.dart
          grep -q 'PageView.builder' scdrive-app/lib/features/head_unit/head_unit_screen.dart
          grep -q 'initialPage: 12000' scdrive-app/lib/features/head_unit/head_unit_screen.dart
          grep -q 'top: false' scdrive-app/lib/features/head_unit/head_unit_screen.dart
          grep -q 'Color(0x1A0A0E13)' scdrive-app/lib/features/head_unit/drive_deck_panel.dart
          grep -q 'com.scdeport.scdrive/gforce_v2' scdrive-app/lib/services/g_force_provider.dart
          grep -q 'TYPE_LINEAR_ACCELERATION' scdrive-app/android/app/src/main/kotlin/com/scdeport/scdrive/gforce/GForceSensorManager.kt
          grep -q 'GForceSensorManager' scdrive-app/android/app/src/main/kotlin/com/scdeport/scdrive/MainActivity.kt
          grep -q 'CAMERA AHEAD' scdrive-app/lib/features/head_unit/drive_deck_panel.dart
          grep -q 'RADIO GARDEN' scdrive-app/lib/features/head_unit/radio_garden_panel.dart
          (cd scdrive-app && sha256sum -c /tmp/v181-physics-authority.sha256)

      - name: Require production Google Maps key
        shell: bash
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${GOOGLE_MAPS_API_KEY:-}"
          echo 'Production Google Maps key present.'

      - name: Resolve dependencies
        working-directory: scdrive-app
        run: |
          rm -f "$PUB_CACHE/credentials.json" "$HOME/.pub-cache/credentials.json" || true
          flutter pub get

      - name: Android unit tests
        working-directory: scdrive-app/android
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          SC_DRIVE_ALLOW_TEST_SIGNING: '1'
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Strict Flutter analyze
        working-directory: scdrive-app
        run: flutter analyze --no-fatal-infos

      - name: Build release candidate
        working-directory: scdrive-app
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SC_DRIVE_ALLOW_TEST_SIGNING: '1'
        run: |
          set -euxo pipefail
          flutter build apk --release \
            --dart-define=SPOTIFY_CLIENT_ID="${SPOTIFY_CLIENT_ID:-}" \
            --dart-define=SC_DRIVE_BUILD_PROFILE=production

      - name: Verify and package candidate
        shell: bash
        run: |
          set -euxo pipefail
          APK=scdrive-app/build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -c -P 16 -v 4 "$APK" >/dev/null
          mkdir -p out/build-tools/lib
          cp "$APK" out/SC_Drive-v1.9.1-GForce-RPM-UI-CANDIDATE.apk
          cp "$BT/zipalign" out/build-tools/zipalign
          cp "$BT/apksigner" out/build-tools/apksigner
          cp "$BT/lib/apksigner.jar" out/build-tools/lib/apksigner.jar
          cp "$BT/aapt" out/build-tools/aapt
          chmod +x out/build-tools/zipalign out/build-tools/apksigner out/build-tools/aapt
          unzip -p "$APK" lib/arm64-v8a/libapp.so | strings | grep -F -m1 'SPEED + RPM TRACE'
          unzip -p "$APK" lib/arm64-v8a/libapp.so | strings | grep -F -m1 'RPM OBD'
          unzip -p "$APK" lib/arm64-v8a/libapp.so | strings | grep -F -m1 'CAMERA AHEAD'
          unzip -p "$APK" classes.dex | strings | grep -F -m1 'com.scdeport.scdrive/gforce_v2'
          "$BT/aapt" dump badging "$APK" | tee out/AAPT-BADGING.txt
          grep -q "package: name='com.scdeport.scdrive'" out/AAPT-BADGING.txt
          grep -q "versionCode='36'" out/AAPT-BADGING.txt
          grep -q "versionName='1.9.1'" out/AAPT-BADGING.txt
          cat > out/V191-FEATURE-VERIFICATION.txt <<EOF
          SC Drive v1.9.1+36
          Dedicated display G-force sensor fusion: INCLUDED
          Sensor source: rotation vector + linear acceleration; accelerometer gravity-removal fallback
          Vehicle-frame rotation: stable GNSS heading
          Stationary bias learning: INCLUDED
          Adaptive alpha-beta G filtering: INCLUDED
          Protected physics authority files: UNCHANGED / CHECKSUM PASS
          G display fallback to existing telemetry: INCLUDED
          Speed + RPM overlay graph: INCLUDED
          RPM source priority: fresh valid OBD 010C -> estimated RPM fallback
          RPM trace color: RED
          Trace cadence: 50 ms; UI target cadence: 33 ms
          Top safe-area deadzone reclaimed: INCLUDED
          Top media pager: practical infinite swipe both directions
          Live Map bottom readout background opacity: 10 percent
          Camera Awareness: PRESERVED
          Radio Garden MediaSession: PRESERVED
          Production Maps key gate: PASS
          Physical head-unit sensor orientation validation: REQUIRED
          EOF
          sha256sum out/SC_Drive-v1.9.1-GForce-RPM-UI-CANDIDATE.apk > out/CANDIDATE.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: SC-Drive-v1.9.1-GForce-RPM-UI-CANDIDATE
          path: out/**
          if-no-files-found: error
          retention-days: 14

      - name: Publish final pointer
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin sc-drive-apk-build
          git checkout -B sc-drive-apk-build origin/sc-drive-apk-build
          mkdir -p build-status
          APK_SHA=''
          if [[ -f out/CANDIDATE.sha256 ]]; then APK_SHA=$(cut -d' ' -f1 out/CANDIDATE.sha256); fi
          cat > build-status/sc-drive-v191-latest.txt <<EOF
          STATUS=${{ job.status }}
          RUN_ID=$GITHUB_RUN_ID
          SOURCE_SHA=$GITHUB_SHA
          ARTIFACT_NAME=SC-Drive-v1.9.1-GForce-RPM-UI-CANDIDATE
          APK_NAME=SC_Drive-v1.9.1-GForce-RPM-UI-CANDIDATE.apk
          APK_SHA256=$APK_SHA
          EOF
          git config user.name 'SC Drive Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add build-status/sc-drive-v191-latest.txt
          git commit -m 'publish v1.9.1 candidate pointer [skip ci]' || true
          git push origin HEAD:sc-drive-apk-build || true
