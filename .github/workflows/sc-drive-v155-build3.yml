name: Build SC Drive v1.5.5 Final Clean APK

on:
  workflow_dispatch:
  push:
    branches: [ sc-drive-apk-build ]
    paths: [ '.github/workflows/sc-drive-v155-build3.yml' ]

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.35.7', channel: stable, cache: true }

      - name: Rebuild verified v1.5.4 baseline
        shell: bash
        run: |
          set -euxo pipefail
          recipe() {
            ruby -ryaml -e 'y=YAML.load_file(ARGV[0]); n=ARGV[1]; s=y["jobs"]["android"]["steps"].find{|x|x["name"]==n}; abort("missing #{n}") unless s&&s["run"]; print s["run"]' .github/workflows/sc-drive-apk.yml "$1" >/tmp/r.sh
            bash /tmp/r.sh
          }
          recipe 'Reconstruct verified base source'
          recipe 'Generate Android scaffold'
          recipe 'Apply verified v1.5.0 overlay'
          recipe 'Apply v1.5.1 clock update and v1.5.2 hardening'
          recipe 'Apply v1.5.4 Visual Master clean patch'

      - name: Apply v1.5.5 clean source changes
        shell: bash
        run: |
          set -euxo pipefail
          base64 -d build-assets/scdrive-v155-nissan-map.patch.gz.b64 >/tmp/v155.gz
          echo 'fe04b55cfedd3a7f6de5eedd6df2fdcc19ae607b5a06c94358fbbd7b63707e91  /tmp/v155.gz' | sha256sum -c -
          gzip -dc /tmp/v155.gz >/tmp/v155.patch
          echo 'c28e085ee5163d964bb6866470d452b7eb8d5b7498e26e9ffc89db62692bf36f  /tmp/v155.patch' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          import re
          src=Path('/tmp/v155.patch').read_text()
          drop={'android/app/src/main/kotlin/com/scdeport/scdrive/MainActivity.kt','scripts/build_apk.sh'}
          out=[]
          for p in re.split(r'(?=^diff --git )',src,flags=re.M):
              m=re.match(r'diff --git a/(\S+) b/(\S+)',p)
              if m and m.group(1) in drop: continue
              out.append(p)
          Path('/tmp/v155-safe.patch').write_text(''.join(out))
          PY
          cd scdrive-app
          mkdir -p assets/fonts scripts
          patch -p1 --forward --batch </tmp/v155-safe.patch
          cat > android/app/src/main/kotlin/com/scdeport/scdrive/MainActivity.kt <<'KT'
          package com.scdeport.scdrive

          import android.app.role.RoleManager
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Build
          import android.provider.Settings
          import android.view.WindowManager
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              private val channels = listOf("com.scdeport.scdrive/headunit")
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  channels.forEach { channelName ->
                      MethodChannel(flutterEngine.dartExecutor.binaryMessenger, channelName)
                          .setMethodCallHandler { call, result ->
                              val method = call.method.lowercase()
                              when {
                                  method == "isgooglemapsconfigured" -> result.success(isGoogleMapsConfigured())
                                  method.contains("home") && (method.contains("is") || method.contains("check")) -> result.success(isDefaultHome())
                                  method.contains("home") && (method.contains("request") || method.contains("set") || method.contains("role")) -> { requestHomeRole(); result.success(true) }
                                  method.contains("home") && method.contains("open") -> { openHomeSettings(); result.success(true) }
                                  method.contains("screen") && (method.contains("keep") || method.contains("wake")) -> { window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON); result.success(true) }
                                  else -> result.notImplemented()
                              }
                          }
                  }
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
              }
              private fun isGoogleMapsConfigured(): Boolean = try {
                  val appInfo = packageManager.getApplicationInfo(packageName, PackageManager.GET_META_DATA)
                  val key = appInfo.metaData?.getString("com.google.android.geo.API_KEY")?.trim().orEmpty()
                  key.isNotEmpty() && key != "SC_DRIVE_MAPS_DISABLED"
              } catch (_: Exception) { false }
              private fun isDefaultHome(): Boolean {
                  val intent = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_HOME)
                  return packageManager.resolveActivity(intent, PackageManager.MATCH_DEFAULT_ONLY)?.activityInfo?.packageName == packageName
              }
              private fun requestHomeRole() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      val rm = getSystemService(Context.ROLE_SERVICE) as RoleManager
                      if (rm.isRoleAvailable(RoleManager.ROLE_HOME) && !rm.isRoleHeld(RoleManager.ROLE_HOME)) {
                          startActivityForResult(rm.createRequestRoleIntent(RoleManager.ROLE_HOME), 9001); return
                      }
                  }
                  openHomeSettings()
              }
              private fun openHomeSettings() {
                  try { startActivity(Intent(Settings.ACTION_HOME_SETTINGS)) }
                  catch (_: Exception) { startActivity(Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_HOME)) }
              }
          }
          KT
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/features/head_unit/drive_deck_panel.dart'); s=p.read_text()
          s=s.replace('            mapType: MapType.normal,\n','')
          s=s.replace('            buildingsEnabled: true,\n','')
          p.write_text(s)
          PY
          grep -n '^version: 1.5.5+12' pubspec.yaml
          grep -n "fontFamily: 'NissanOpti'" lib/app/app.dart
          grep -n 'isGoogleMapsConfigured' lib/services/head_unit_platform_service.dart
          ! grep -q 'mapType: MapType.normal' lib/features/head_unit/drive_deck_panel.dart
          ! grep -q 'buildingsEnabled: true' lib/features/head_unit/drive_deck_panel.dart
          cp "$(fc-match -f '%{file}' 'DejaVu Sans' | head -1)" assets/fonts/NissanOpti.otf
          cp "$(fc-match -f '%{file}' 'DejaVu Sans:slant=italic' | head -1)" assets/fonts/NissanOpti-Italic.otf

      - name: Dependencies and Android Auto hardening
        shell: bash
        run: |
          set -euxo pipefail
          (cd scdrive-app && flutter pub get)
          ruby -ryaml -e 'y=YAML.load_file(ARGV[0]); s=y["jobs"]["android"]["steps"].find{|x|x["name"]=="Harden Android Auto plugin"}; abort("hardening step missing") unless s&&s["run"]; print s["run"]' .github/workflows/sc-drive-apk.yml >/tmp/harden.sh
          bash /tmp/harden.sh

      - name: Strict analyze
        working-directory: scdrive-app
        run: flutter analyze

      - name: Build release APK
        working-directory: scdrive-app
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          SC_DRIVE_ALLOW_TEST_SIGNING: '1'
        run: |
          flutter build apk --release \
            --dart-define=SPOTIFY_CLIENT_ID="${SPOTIFY_CLIENT_ID:-}" \
            --dart-define=SC_DRIVE_BUILD_PROFILE=ci-test

      - name: Verify and package
        shell: bash
        run: |
          set -euxo pipefail
          APK=scdrive-app/build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"; unzip -t "$APK" >/dev/null
          mkdir -p out/tools
          cp "$APK" out/SC_Drive-v1.5.5-CI-placeholder-font.apk
          sha256sum out/SC_Drive-v1.5.5-CI-placeholder-font.apk >out/SC_Drive-v1.5.5-CI-placeholder-font.apk.sha256
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          cp "$BT/apksigner" out/tools/apksigner
          cp "$BT/zipalign" out/tools/zipalign
          chmod +x out/tools/*

      - uses: actions/upload-artifact@v4
        with:
          name: SC-Drive-v1.5.5-FINAL-CLEAN-APK-AND-TOOLS
          path: out/*
          if-no-files-found: error
          retention-days: 14
