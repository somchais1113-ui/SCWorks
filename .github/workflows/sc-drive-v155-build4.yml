name: Build SC Drive v1.5.5 Signed Candidate

on:
  workflow_dispatch:
  push:
    branches: [ sc-drive-apk-build ]
    paths: [ '.github/workflows/sc-drive-v155-build4.yml' ]

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.35.7', channel: stable, cache: true }

      - name: Reconstruct and harden v1.5.5
        shell: bash
        run: |
          set -euxo pipefail
          run_from_v3() {
            ruby -ryaml -e 'y=YAML.load_file(ARGV[0]); n=ARGV[1]; s=y["jobs"]["android"]["steps"].find{|x|x["name"]==n}; abort("missing #{n}") unless s&&s["run"]; print s["run"]' .github/workflows/sc-drive-v155-build3.yml "$1" >/tmp/step.sh
            bash /tmp/step.sh
          }
          run_from_v3 'Rebuild verified v1.5.4 baseline'
          run_from_v3 'Apply v1.5.5 clean source changes'
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scdrive-app/android/app/build.gradle.kts'); s=p.read_text()
          if 'import java.util.Properties\n' not in s:
              s=s.replace('import org.jetbrains.kotlin.gradle.dsl.JvmTarget\n','import org.jetbrains.kotlin.gradle.dsl.JvmTarget\nimport java.util.Properties\n',1)
          s=s.replace('java.util.Properties().apply {','Properties().apply {',1)
          p.write_text(s)
          PY
          grep -n 'import java.util.Properties' scdrive-app/android/app/build.gradle.kts
          grep -n 'Properties().apply' scdrive-app/android/app/build.gradle.kts
          run_from_v3 'Dependencies and Android Auto hardening'

      - name: Strict analyze
        working-directory: scdrive-app
        run: flutter analyze

      - name: Build release APK
        working-directory: scdrive-app
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          SC_DRIVE_ALLOW_TEST_SIGNING: '1'
        run: |
          flutter build apk --release \
            --dart-define=SPOTIFY_CLIENT_ID="${SPOTIFY_CLIENT_ID:-}" \
            --dart-define=SC_DRIVE_BUILD_PROFILE=ci-test

      - name: Verify and package
        shell: bash
        run: |
          set -euxo pipefail
          APK=scdrive-app/build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"; unzip -t "$APK" >/dev/null
          mkdir -p out/tools
          cp "$APK" out/SC_Drive-v1.5.5-CI-placeholder-font.apk
          sha256sum out/SC_Drive-v1.5.5-CI-placeholder-font.apk >out/SC_Drive-v1.5.5-CI-placeholder-font.apk.sha256
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          cp "$BT/apksigner" out/tools/apksigner
          cp "$BT/zipalign" out/tools/zipalign
          chmod +x out/tools/*

      - uses: actions/upload-artifact@v4
        with:
          name: SC-Drive-v1.5.5-SIGNED-CANDIDATE-AND-TOOLS
          path: out/*
          if-no-files-found: error
          retention-days: 14
