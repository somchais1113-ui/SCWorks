name: Build SC Drive v1.8.2 Radio Maps Diagnose

on:
  push:
    branches: [ sc-drive-apk-build ]
    paths:
      - '.github/workflows/sc-drive-v181-ui-polish.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Reconstruct v1.8.1 polished source
        shell: bash
        run: |
          set -euxo pipefail
          rm -f "$PUB_CACHE/credentials.json" "$HOME/.pub-cache/credentials.json" || true
          mkdir -p /tmp/scdrive-flutter-wrap
          cat > /tmp/scdrive-flutter-wrap/flutter <<'EOF'
          #!/usr/bin/env bash
          set -e
          REAL="${SC_DRIVE_REAL_FLUTTER:?}"
          if [[ "${1:-}" == "create" ]]; then shift; exec "$REAL" create --no-pub "$@"; fi
          if [[ "${1:-}" == "pub" && "${2:-}" == "get" ]]; then shift 2; rm -f "${PUB_CACHE:-$HOME/.pub-cache}/credentials.json" "$HOME/.pub-cache/credentials.json" || true; exec "$REAL" pub get "$@"; fi
          exec "$REAL" "$@"
          EOF
          chmod +x /tmp/scdrive-flutter-wrap/flutter
          export SC_DRIVE_REAL_FLUTTER="$FLUTTER_ROOT/bin/flutter"
          export PATH="/tmp/scdrive-flutter-wrap:$PATH"
          run_step() {
            ruby -ryaml -e 'y=YAML.load_file(ARGV[0]); n=ARGV[1]; s=y["jobs"]["android"]["steps"].find{|x|x["name"]==n}; abort("missing #{n}") unless s&&s["run"]; print s["run"]' "$1" "$2" >/tmp/step.sh
            bash /tmp/step.sh
          }
          run_step .github/workflows/sc-drive-v181-openvehicle.yml 'Reconstruct verified v1.8.0 base'
          run_step .github/workflows/sc-drive-v181-openvehicle.yml 'Apply v1.8.1 SC OpenVehicle overlay'
          cat build-assets/v181-polish-delta-s/00.b64 build-assets/v181-polish-delta-s/01p{0,1,2,3}.b64 build-assets/v181-polish-delta-s/02.b64 build-assets/v181-polish-delta-s/03.b64 > /tmp/v181-polish.b64
          base64 -d /tmp/v181-polish.b64 > /tmp/v181-polish.tar.gz
          tar -xzf /tmp/v181-polish.tar.gz -C scdrive-app
          patch -d scdrive-app -p1 --forward --batch < build-assets/v181-polish-delta-s/ui-const-fix.patch
          patch -d scdrive-app -p1 --forward --batch < build-assets/v181-polish-delta-s/ui-radio-lint-fix.patch
      - name: Dump radio maps implementation
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            scdrive-app/lib/services/car_radio_service.dart \
            scdrive-app/lib/features/head_unit/car_radio_panel.dart \
            scdrive-app/android/app/src/main/kotlin/com/scdeport/scdrive/MainActivity.kt \
            scdrive-app/android/app/src/main/AndroidManifest.xml \
            scdrive-app/android/app/build.gradle.kts \
            scdrive-app/android/app/build.gradle; do
            if [[ -f "$f" ]]; then echo "===== $f ====="; cat "$f"; fi
          done
          echo '===== MAP REFERENCES ====='
          grep -RniE 'GOOGLE_MAPS_API_KEY|com.google.android.geo.API_KEY|GoogleMap|mapsApiKey|MAPS_API' scdrive-app/android scdrive-app/lib | head -200 || true
