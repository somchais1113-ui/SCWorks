name: Build SC Drive v1.9.2 Dual Gauge Loop

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/sc-drive-v192-dual-gauge-loop.yml'
      - 'build-assets/v192/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sc-drive-v192-dual-gauge-loop
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sc-drive-apk-build
          fetch-depth: 1

      - name: Publish running pointer
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build-status
          cat > build-status/sc-drive-v192-latest.txt <<EOF
          STATUS=running
          RUN_ID=$GITHUB_RUN_ID
          SOURCE_SHA=$GITHUB_SHA
          ARTIFACT_NAME=SC-Drive-v1.9.2-Dual-Gauge-Loop-CANDIDATE
          APK_NAME=SC_Drive-v1.9.2-Dual-Gauge-Loop-CANDIDATE.apk
          APK_SHA256=
          EOF
          git config user.name 'SC Drive Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add build-status/sc-drive-v192-latest.txt
          git commit -m 'publish v1.9.2 running pointer [skip ci]' || true
          git push origin HEAD:sc-drive-apk-build || true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Reconstruct exact v1.9.1 source
        shell: bash
        run: |
          set -euxo pipefail
          git fetch --depth=1 origin main
          git show origin/main:.github/workflows/sc-drive-v189-inspect-media.yml > /tmp/inspect-v188.yml
          ruby -ryaml -e 'y=YAML.load_file(ARGV[0]); n=ARGV[1]; s=y["jobs"]["inspect"]["steps"].find{|x|x["name"]==n}; abort("missing #{n}") unless s&&s["run"]; print s["run"]' /tmp/inspect-v188.yml 'Reconstruct v1.8.8 source' >/tmp/reconstruct-v188.sh
          bash /tmp/reconstruct-v188.sh
          mkdir -p build-assets/v190
          git show origin/main:build-assets/v190/drive_dynamics_panel.dart > build-assets/v190/drive_dynamics_panel.dart
          git show origin/main:build-assets/v190/apply-v190.sh > build-assets/v190/apply-v190.sh
          chmod +x build-assets/v190/apply-v190.sh
          bash build-assets/v190/apply-v190.sh
          git show origin/main:build-assets/v191/v191-bundle.tar.gz.b64 | tr -d '\r\n' | base64 --decode > /tmp/v191.tar.gz
          echo '776d0546860259ac9d263d12ddd534b2904ff9800e5e7c3cdfbada3d245b0a89  /tmp/v191.tar.gz' | sha256sum -c -
          tar -xzf /tmp/v191.tar.gz
          chmod +x build-assets/v191/apply-v191.sh
          bash build-assets/v191/apply-v191.sh
          grep -n '^version: 1.9.1+36' scdrive-app/pubspec.yaml

      - name: Apply v1.9.2 UI and pager refinements
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build-assets/v192
          git show origin/main:build-assets/v192/v192-ui-loop.patch > build-assets/v192/v192-ui-loop.patch
          git show origin/main:build-assets/v192/apply-v192.sh > build-assets/v192/apply-v192.sh
          chmod +x build-assets/v192/apply-v192.sh
          bash build-assets/v192/apply-v192.sh

      - name: Source gates
        shell: bash
        run: |
          set -euxo pipefail
          grep -n '^version: 1.9.2+37' scdrive-app/pubspec.yaml
          grep -q 'final topClearance = math.max' scdrive-app/lib/features/head_unit/head_unit_screen.dart
          grep -q 'MediaQuery.viewPaddingOf(context).top' scdrive-app/lib/features/head_unit/head_unit_screen.dart
          grep -q "label: 'RPM SOURCE'" scdrive-app/lib/features/head_unit/head_unit_screen.dart
          grep -q "'OBD LIVE'" scdrive-app/lib/features/head_unit/head_unit_screen.dart
          grep -q 'rpmAgeMs <= 1800' scdrive-app/lib/features/head_unit/head_unit_screen.dart
          grep -q 'final tachRadius = outerRadius \* 0.655' scdrive-app/lib/features/head_unit/head_unit_screen.dart
          grep -q 'const redZoneStart = 0.82' scdrive-app/lib/features/head_unit/head_unit_screen.dart
          grep -q 'PageController(initialPage: _loopAnchor)' scdrive-app/lib/features/head_unit/drive_deck_panel.dart
          grep -q 'index.isEven ? _mapPage() : _drivePage()' scdrive-app/lib/features/head_unit/drive_deck_panel.dart
          grep -q 'Color(0x1A0A0E13)' scdrive-app/lib/features/head_unit/drive_deck_panel.dart
          grep -q 'SPEED + RPM TRACE' scdrive-app/lib/features/head_unit/drive_dynamics_panel.dart
          grep -q 'CAMERA AHEAD' scdrive-app/lib/features/head_unit/drive_deck_panel.dart
          grep -q 'RADIO GARDEN' scdrive-app/lib/features/head_unit/radio_garden_panel.dart
          (cd scdrive-app && sha256sum -c /tmp/v181-physics-authority.sha256)

      - name: Require production Google Maps key
        shell: bash
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${GOOGLE_MAPS_API_KEY:-}"
          echo 'Production Google Maps key present.'

      - name: Resolve dependencies
        working-directory: scdrive-app
        run: |
          rm -f "$PUB_CACHE/credentials.json" "$HOME/.pub-cache/credentials.json" || true
          flutter pub get

      - name: Android unit tests
        working-directory: scdrive-app/android
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          SC_DRIVE_ALLOW_TEST_SIGNING: '1'
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Flutter analyze
        working-directory: scdrive-app
        run: flutter analyze --no-fatal-infos

      - name: Build release candidate
        working-directory: scdrive-app
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SC_DRIVE_ALLOW_TEST_SIGNING: '1'
        run: |
          set -euxo pipefail
          flutter build apk --release \
            --dart-define=SPOTIFY_CLIENT_ID="${SPOTIFY_CLIENT_ID:-}" \
            --dart-define=SC_DRIVE_BUILD_PROFILE=production

      - name: Verify and package candidate
        shell: bash
        run: |
          set -euxo pipefail
          APK=scdrive-app/build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -c -P 16 -v 4 "$APK" >/dev/null
          mkdir -p out/build-tools/lib
          cp "$APK" out/SC_Drive-v1.9.2-Dual-Gauge-Loop-CANDIDATE.apk
          cp "$BT/zipalign" out/build-tools/zipalign
          cp "$BT/apksigner" out/build-tools/apksigner
          cp "$BT/lib/apksigner.jar" out/build-tools/lib/apksigner.jar
          cp "$BT/aapt" out/build-tools/aapt
          chmod +x out/build-tools/zipalign out/build-tools/apksigner out/build-tools/aapt
          unzip -p "$APK" lib/arm64-v8a/libapp.so | strings | grep -F -m1 'RPM SOURCE'
          unzip -p "$APK" lib/arm64-v8a/libapp.so | strings | grep -F -m1 'OBD LIVE'
          unzip -p "$APK" lib/arm64-v8a/libapp.so | strings | grep -F -m1 'LIVE MAP'
          unzip -p "$APK" lib/arm64-v8a/libapp.so | strings | grep -F -m1 'DRIVE DATA'
          "$BT/aapt" dump badging "$APK" | tee out/AAPT-BADGING.txt
          grep -q "package: name='com.scdeport.scdrive'" out/AAPT-BADGING.txt
          grep -q "versionCode='37'" out/AAPT-BADGING.txt
          grep -q "versionName='1.9.2'" out/AAPT-BADGING.txt
          cat > out/V192-FEATURE-VERIFICATION.txt <<EOF
          SC Drive v1.9.2+37
          Top clearance: approximately 5 mm logical minimum plus Android viewPadding
          Instrument cluster: two concentric functional rings
          Outer ring: speed 0-240 km/h
          Inner ring: RPM arc, no RPM numerals, red-zone cue
          RPM source priority: fresh valid OBD 010C then estimated RPM fallback
          RPM repaint while GPS unlocked/stationary: INCLUDED
          Live Map / Drive Data pager: continuous practical loop in either swipe direction
          Live Map bottom readout background opacity: 10 percent PRESERVED
          Speed + RPM trace: PRESERVED
          G-force v2: PRESERVED
          Camera Awareness: PRESERVED
          Radio Garden MediaSession: PRESERVED
          Protected physics authority files: UNCHANGED / CHECKSUM PASS
          Google Maps repeated-platform-view behavior: PHYSICAL HEAD-UNIT VALIDATION REQUIRED
          EOF
          sha256sum out/SC_Drive-v1.9.2-Dual-Gauge-Loop-CANDIDATE.apk > out/CANDIDATE.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: SC-Drive-v1.9.2-Dual-Gauge-Loop-CANDIDATE
          path: out/**
          if-no-files-found: error
          retention-days: 14

      - name: Publish final pointer
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin sc-drive-apk-build
          git checkout -B sc-drive-apk-build origin/sc-drive-apk-build
          mkdir -p build-status
          APK_SHA=''
          if [[ -f out/CANDIDATE.sha256 ]]; then APK_SHA=$(cut -d' ' -f1 out/CANDIDATE.sha256); fi
          cat > build-status/sc-drive-v192-latest.txt <<EOF
          STATUS=${{ job.status }}
          RUN_ID=$GITHUB_RUN_ID
          SOURCE_SHA=$GITHUB_SHA
          ARTIFACT_NAME=SC-Drive-v1.9.2-Dual-Gauge-Loop-CANDIDATE
          APK_NAME=SC_Drive-v1.9.2-Dual-Gauge-Loop-CANDIDATE.apk
          APK_SHA256=$APK_SHA
          EOF
          git config user.name 'SC Drive Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add build-status/sc-drive-v192-latest.txt
          git commit -m 'publish v1.9.2 candidate pointer [skip ci]' || true
          git push origin HEAD:sc-drive-apk-build || true
