name: Build SC Drive v1.8.9 Native Media Favorites

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/sc-drive-v189-media-native-favorites.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sc-drive-v189-media-native-favorites
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sc-drive-apk-build
          fetch-depth: 1

      - name: Publish running pointer
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build-status
          cat > build-status/sc-drive-v189-latest.txt <<EOF
          STATUS=running
          RUN_ID=$GITHUB_RUN_ID
          SOURCE_SHA=$GITHUB_SHA
          ARTIFACT_NAME=SC-Drive-v1.8.9-Native-Media-Favorites-CANDIDATE
          APK_NAME=SC_Drive-v1.8.9-Native-Media-Favorites-CANDIDATE.apk
          APK_SHA256=
          EOF
          git config user.name 'SC Drive Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add build-status/sc-drive-v189-latest.txt
          git commit -m 'publish v1.8.9 running pointer [skip ci]' || true
          git push origin HEAD:sc-drive-apk-build || true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Reconstruct v1.8.8 production feature baseline
        shell: bash
        run: |
          set -euxo pipefail
          git fetch --depth=1 origin main
          rm -rf "$PUB_CACHE/hosted/pub.dev/flutter_carplay-1.6.4" || true
          ruby -ryaml -e 'y=YAML.load_file(ARGV[0]); n=ARGV[1]; s=y["jobs"]["android-final"]["steps"].find{|x|x["name"]==n}; abort("missing #{n}") unless s&&s["run"]; print s["run"]' .github/workflows/sc-drive-v182-final-sign.yml 'Reconstruct exact v1.8.2 source' >/tmp/base.sh
          bash /tmp/base.sh
          git show origin/main:.github/workflows/sc-drive-v187-camera-awareness-latest.yml > /tmp/v187.yml
          ruby -ryaml -e 'y=YAML.load_file(ARGV[0]); n=ARGV[1]; s=y["jobs"]["android"]["steps"].find{|x|x["name"]==n}; abort("missing #{n}") unless s&&s["run"]; print s["run"]' /tmp/v187.yml 'Apply Camera Awareness and Drive Dynamics overlays' >/tmp/v187-camera-dynamics.sh
          bash /tmp/v187-camera-dynamics.sh
          ruby -ryaml -e 'y=YAML.load_file(ARGV[0]); n=ARGV[1]; s=y["jobs"]["android"]["steps"].find{|x|x["name"]==n}; abort("missing #{n}") unless s&&s["run"]; print s["run"]' /tmp/v187.yml 'Apply Radio Garden companion overlay' >/tmp/v187-radio.sh
          bash /tmp/v187-radio.sh
          ruby -ryaml -e 'y=YAML.load_file(ARGV[0]); n=ARGV[1]; s=y["jobs"]["android"]["steps"].find{|x|x["name"]==n}; abort("missing #{n}") unless s&&s["run"]; print s["run"]' /tmp/v187.yml 'Lock Camera Awareness into latest build and bump v1.8.7' >/tmp/v187-lock.sh
          bash /tmp/v187-lock.sh
          mkdir -p build-assets/v188
          git show origin/main:build-assets/v188/camera_awareness_service.dart > build-assets/v188/camera_awareness_service.dart
          git show origin/main:build-assets/v188/radio_garden_panel.dart > build-assets/v188/radio_garden_panel.dart
          git show origin/main:build-assets/v188/apply-v188.sh > build-assets/v188/apply-v188.sh
          chmod +x build-assets/v188/apply-v188.sh
          bash build-assets/v188/apply-v188.sh
          grep -n '^version: 1.8.8+34' scdrive-app/pubspec.yaml

      - name: Apply v1.8.9 native media and SC Drive station favorites
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/v189
          for n in 00 01 02 03 04 05 06 07; do
            git show "origin/main:build-assets/v189/media-v189.patch.part${n}" >> /tmp/v189/media.patch
          done
          echo '4151da5a19086e7883027b39de6bf9805260cece9c0484249f96113298d38e06  /tmp/v189/media.patch' | sha256sum -c -
          git apply --check /tmp/v189/media.patch
          git apply /tmp/v189/media.patch
          sed -i 's/^version: 1\.8\.8+34$/version: 1.8.9+35/' scdrive-app/pubspec.yaml

      - name: Source gates
        shell: bash
        run: |
          set -euxo pipefail
          grep -n '^version: 1.8.9+35' scdrive-app/pubspec.yaml
          grep -q 'setPackage(SPOTIFY_PACKAGE)' scdrive-app/android/app/src/main/kotlin/com/scdeport/scdrive/spotify/SpotifyMediaSessionBridge.kt
          grep -q 'openSpotify' scdrive-app/android/app/src/main/kotlin/com/scdeport/scdrive/spotify/SpotifyMediaSessionBridge.kt
          grep -q 'playSpotifyUri' scdrive-app/lib/services/spotify_service.dart
          grep -q "body\['context_uri'\]" scdrive-app/lib/services/spotify_service.dart
          grep -q 'com.jonathanpuckey.radiogarden' scdrive-app/android/app/src/main/AndroidManifest.xml
          grep -q 'consumeradiogardenshare' scdrive-app/android/app/src/main/kotlin/com/scdeport/scdrive/MainActivity.kt
          grep -q 'sc_drive_radio_garden_favorites_v1' scdrive-app/lib/features/head_unit/radio_garden_panel.dart
          grep -q 'STATION SAVED TO SC DRIVE' scdrive-app/lib/features/head_unit/radio_garden_panel.dart
          ! grep -q 'LaunchMode.externalApplication' scdrive-app/lib/features/head_unit/radio_garden_panel.dart
          grep -q 'CAMERA AHEAD' scdrive-app/lib/features/head_unit/drive_deck_panel.dart
          grep -q 'gpsConfidence: t.gpsConfidence' scdrive-app/lib/features/head_unit/drive_deck_panel.dart
          grep -q 'G-G DIAGRAM' scdrive-app/lib/features/head_unit/drive_dynamics_panel.dart
          grep -q '_digitalSpeed >= 100' scdrive-app/lib/features/head_unit/head_unit_screen.dart
          (cd scdrive-app && sha256sum -c /tmp/v181-physics-authority.sha256)

      - name: Require production Google Maps key
        shell: bash
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${GOOGLE_MAPS_API_KEY:-}"
          echo 'Production Google Maps key present.'

      - name: Resolve dependencies
        working-directory: scdrive-app
        run: |
          rm -f "$PUB_CACHE/credentials.json" "$HOME/.pub-cache/credentials.json" || true
          flutter pub get

      - name: Android unit tests
        working-directory: scdrive-app/android
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          SC_DRIVE_ALLOW_TEST_SIGNING: '1'
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Strict Flutter analyze
        working-directory: scdrive-app
        run: flutter analyze --no-fatal-infos

      - name: Build release candidate
        working-directory: scdrive-app
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SC_DRIVE_ALLOW_TEST_SIGNING: '1'
        run: |
          set -euxo pipefail
          flutter build apk --release \
            --dart-define=SPOTIFY_CLIENT_ID="${SPOTIFY_CLIENT_ID:-}" \
            --dart-define=SC_DRIVE_BUILD_PROFILE=production

      - name: Verify and package candidate
        shell: bash
        run: |
          set -euxo pipefail
          APK=scdrive-app/build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -c -P 16 -v 4 "$APK" >/dev/null
          mkdir -p out/build-tools/lib
          cp "$APK" out/SC_Drive-v1.8.9-Native-Media-Favorites-CANDIDATE.apk
          cp "$BT/zipalign" out/build-tools/zipalign
          cp "$BT/apksigner" out/build-tools/apksigner
          cp "$BT/lib/apksigner.jar" out/build-tools/lib/apksigner.jar
          cp "$BT/aapt" out/build-tools/aapt
          chmod +x out/build-tools/zipalign out/build-tools/apksigner out/build-tools/aapt
          unzip -p "$APK" classes.dex | strings | grep -F -m1 'com.jonathanpuckey.radiogarden'
          unzip -p "$APK" classes.dex | strings | grep -F -m1 'com.spotify.music'
          unzip -p "$APK" lib/arm64-v8a/libapp.so | strings | grep -F -m1 'STATION SAVED TO SC DRIVE'
          unzip -p "$APK" lib/arm64-v8a/libapp.so | strings | grep -F -m1 'G-G DIAGRAM'
          "$BT/aapt" dump badging "$APK" | tee out/AAPT-BADGING.txt
          grep -q "package: name='com.scdeport.scdrive'" out/AAPT-BADGING.txt
          grep -q "versionCode='35'" out/AAPT-BADGING.txt
          grep -q "versionName='1.8.9'" out/AAPT-BADGING.txt
          cat > out/V189-FEATURE-VERIFICATION.txt <<EOF
          SC Drive v1.8.9+35
          Spotify playlist/recent direct Web API playback: INCLUDED
          Spotify explicit installed-app fallback: INCLUDED
          Spotify Browser playback launch path: REMOVED from day-to-day media actions
          Spotify OAuth browser/custom-tab: RETAINED for secure account authorization
          Radio Garden explicit package launch: INCLUDED
          Radio Garden Browser fallback: REMOVED
          Radio Garden ACTION_SEND station capture: INCLUDED
          SC Drive local Radio Garden favorites: INCLUDED
          SC Drive last Radio Garden station: INCLUDED
          Radio Garden MediaSession controls: INCLUDED
          Camera GPS confidence/road corridor: PRESERVED
          Drive Dynamics page 3: PRESERVED
          Physics authority checksum: PASS
          Production Google Maps key gate: PASS
          Physical head-unit validation: REQUIRED
          EOF
          sha256sum out/SC_Drive-v1.8.9-Native-Media-Favorites-CANDIDATE.apk > out/CANDIDATE.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: SC-Drive-v1.8.9-Native-Media-Favorites-CANDIDATE
          path: out/**
          if-no-files-found: error
          retention-days: 14

      - name: Publish final pointer
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin sc-drive-apk-build
          git checkout -B sc-drive-apk-build origin/sc-drive-apk-build
          mkdir -p build-status
          APK_SHA=''
          if [[ -f out/CANDIDATE.sha256 ]]; then APK_SHA=$(cut -d' ' -f1 out/CANDIDATE.sha256); fi
          cat > build-status/sc-drive-v189-latest.txt <<EOF
          STATUS=${{ job.status }}
          RUN_ID=$GITHUB_RUN_ID
          SOURCE_SHA=$GITHUB_SHA
          ARTIFACT_NAME=SC-Drive-v1.8.9-Native-Media-Favorites-CANDIDATE
          APK_NAME=SC_Drive-v1.8.9-Native-Media-Favorites-CANDIDATE.apk
          APK_SHA256=$APK_SHA
          EOF
          git config user.name 'SC Drive Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add build-status/sc-drive-v189-latest.txt
          git commit -m 'publish v1.8.9 candidate pointer [skip ci]' || true
          git push origin HEAD:sc-drive-apk-build || true
