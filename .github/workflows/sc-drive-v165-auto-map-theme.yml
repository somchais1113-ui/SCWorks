name: Build SC Drive v1.6.5 Auto Map Theme

on:
  push:
    branches: [ sc-drive-apk-build ]
    paths:
      - '.github/workflows/sc-drive-v165-auto-map-theme.yml'
      - 'build-assets/v165-auto-map-theme/**'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Reconstruct verified v1.6.4 base
        shell: bash
        run: |
          set -euxo pipefail
          run_v164_step() {
            ruby -ryaml -e 'y=YAML.load_file(ARGV[0]); n=ARGV[1]; s=y["jobs"]["android"]["steps"].find{|x|x["name"]==n}; abort("missing #{n}") unless s&&s["run"]; print s["run"]' .github/workflows/sc-drive-v164-adaptive-map.yml "$1" >/tmp/v164-step.sh
            bash /tmp/v164-step.sh
          }
          run_v164_step 'Reconstruct verified v1.6.3 base'
          run_v164_step 'Apply smooth map and adaptive camera'
          cd scdrive-app
          flutter pub get
          dart fix --apply
          grep -n '^version: 1.6.4+18' pubspec.yaml

      - name: Apply automatic day night tunnel map
        shell: bash
        run: |
          set -euxo pipefail
          base64 -d build-assets/v165-auto-map-theme/patch.b64 >/tmp/v165.patch.gz
          echo '9aaf3101361384f5694a6decf67318acb8a792a43b69f7f1daa79e30862331b9  /tmp/v165.patch.gz' | sha256sum -c -
          gzip -dc /tmp/v165.patch.gz >/tmp/v165.patch
          echo 'b1ecc649bf89ad3cf7885227c6380ee76c2e026e82f3dd059d47ae792d513d1e  /tmp/v165.patch' | sha256sum -c -
          cd scdrive-app
          patch -p1 --batch --forward </tmp/v165.patch
          dart format lib/features/head_unit/drive_deck_panel.dart
          grep -n '^version: 1.6.5+19' pubspec.yaml
          grep -n '_solarElevationDeg' lib/features/head_unit/drive_deck_panel.dart
          grep -n 'TUNNEL DARK' lib/features/head_unit/drive_deck_panel.dart
          grep -n 'style: _activeMapStyle' lib/features/head_unit/drive_deck_panel.dart
          test -z "$(find . -name '*.rej' -print -quit)"

      - name: Resolve dependencies
        working-directory: scdrive-app
        run: flutter pub get

      - name: Apply safe analyzer fixes
        working-directory: scdrive-app
        run: dart fix --apply

      - name: Strict analyze
        working-directory: scdrive-app
        run: flutter analyze

      - name: Build release candidate
        working-directory: scdrive-app
        env:
          GOOGLE_MAPS_API_KEY: AIza00000000000000000000000000000000000
          SC_DRIVE_ALLOW_TEST_SIGNING: '1'
        run: |
          flutter build apk --release \
            --dart-define=SC_DRIVE_BUILD_PROFILE=production

      - name: Verify candidate
        shell: bash
        run: |
          set -euxo pipefail
          APK=scdrive-app/build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -c -P 16 -v 4 "$APK" >/dev/null
          mkdir -p out/tools/lib
          cp "$APK" out/SC_Drive-v1.6.5-AutoMapTheme-CI-DUMMY-MAPS.apk
          cp "$BT/apksigner" out/tools/apksigner
          cp "$BT/zipalign" out/tools/zipalign
          cp "$BT/lib/apksigner.jar" out/tools/lib/apksigner.jar
          chmod +x out/tools/apksigner out/tools/zipalign
          sha256sum "$APK" > out/candidate.sha256
          tar --exclude=.dart_tool --exclude=build --exclude=.gradle -czf out/SC_Drive-v1.6.5-Source.tar.gz -C scdrive-app .

      - uses: actions/upload-artifact@v4
        with:
          name: SC-Drive-v1.6.5-AutoMapTheme-CANDIDATE
          path: out/**
          if-no-files-found: error
          retention-days: 7
