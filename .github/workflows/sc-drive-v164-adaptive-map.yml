name: Build SC Drive v1.6.4 Adaptive Map

on:
  push:
    branches: [ sc-drive-apk-build ]
    paths:
      - '.github/workflows/sc-drive-v164-adaptive-map.yml'
      - 'build-assets/v164-adaptive-map-v2/**'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Reconstruct verified v1.6.3 base
        shell: bash
        run: |
          set -euxo pipefail
          run_v163_step() {
            ruby -ryaml -e 'y=YAML.load_file(ARGV[0]); n=ARGV[1]; s=y["jobs"]["android"]["steps"].find{|x|x["name"]==n}; abort("missing #{n}") unless s&&s["run"]; print s["run"]' .github/workflows/sc-drive-v163-build.yml "$1" >/tmp/v163-step.sh
            bash /tmp/v163-step.sh
          }
          run_v163_step 'Reconstruct v1.6.0 verified base'
          run_v163_step 'Apply v1.6.3 feature patch'
          cd scdrive-app
          flutter pub get
          dart fix --apply
          grep -n '^version: 1.6.3+17' pubspec.yaml

      - name: Apply smooth map and adaptive camera
        shell: bash
        run: |
          set -euxo pipefail
          cat build-assets/v164-adaptive-map-v2/{00,01,02}.b64 >/tmp/v164.b64
          echo '9e157864889f603ea42e0af0efa34f03c8c2172c7b6cb22199a46f70acec405d  /tmp/v164.b64' | sha256sum -c -
          base64 -d /tmp/v164.b64 >/tmp/v164.patch.gz
          echo '18564e9a7b8ca1ac9bd61319d4a7aab18996b3d8b67f0e717aea60dc6bacf6e3  /tmp/v164.patch.gz' | sha256sum -c -
          gzip -dc /tmp/v164.patch.gz >/tmp/v164.patch
          cd scdrive-app
          patch -p1 --batch --forward </tmp/v164.patch
          dart format lib/features/head_unit/drive_deck_panel.dart
          grep -n '^version: 1.6.4+18' pubspec.yaml
          grep -n 'Duration(milliseconds: 60)' lib/features/head_unit/drive_deck_panel.dart
          grep -n 'PREDICTING POSITION' lib/features/head_unit/drive_deck_panel.dart
          grep -n 'myLocationEnabled: false' lib/features/head_unit/drive_deck_panel.dart
          test -z "$(find . -name '*.rej' -print -quit)"

      - name: Resolve dependencies
        working-directory: scdrive-app
        run: flutter pub get

      - name: Strict analyze
        working-directory: scdrive-app
        run: flutter analyze

      - name: Build release candidate
        working-directory: scdrive-app
        env:
          GOOGLE_MAPS_API_KEY: AIza00000000000000000000000000000000000
          SC_DRIVE_ALLOW_TEST_SIGNING: '1'
        run: |
          flutter build apk --release \
            --dart-define=SPOTIFY_CLIENT_ID=00000000000000000000000000000000 \
            --dart-define=SC_DRIVE_BUILD_PROFILE=production

      - name: Verify candidate
        shell: bash
        run: |
          set -euxo pipefail
          APK=scdrive-app/build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -c -P 16 -v 4 "$APK" >/dev/null
          mkdir -p out
          cp "$APK" out/SC_Drive-v1.6.4-AdaptiveMap-CI-DUMMY-CONFIG.apk
          sha256sum "$APK" > out/candidate.sha256
          tar --exclude=.dart_tool --exclude=build --exclude=.gradle -czf out/SC_Drive-v1.6.4-Source.tar.gz -C scdrive-app .

      - uses: actions/upload-artifact@v4
        with:
          name: SC-Drive-v1.6.4-AdaptiveMap-CANDIDATE
          path: out/**
          if-no-files-found: error
          retention-days: 7
