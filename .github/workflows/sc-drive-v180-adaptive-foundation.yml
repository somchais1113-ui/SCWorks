name: Build SC Drive v1.8.0 Adaptive Foundation

on:
  push:
    branches: [ sc-drive-apk-build ]
    paths:
      - '.github/workflows/sc-drive-v180-adaptive-foundation.yml'
      - 'build-assets/v180-adaptive-s/**'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Enable offline-safe Flutter reconstruction
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/scdrive-flutter-wrap
          cat > /tmp/scdrive-flutter-wrap/flutter <<'EOF'
          #!/usr/bin/env bash
          set -e
          REAL="${SC_DRIVE_REAL_FLUTTER:?}"
          if [[ "${1:-}" == "create" ]]; then
            shift
            exec "$REAL" create --no-pub "$@"
          fi
          if [[ "${1:-}" == "pub" && "${2:-}" == "get" ]]; then
            shift 2
            exec "$REAL" pub get --offline "$@"
          fi
          exec "$REAL" "$@"
          EOF
          chmod +x /tmp/scdrive-flutter-wrap/flutter
          echo "SC_DRIVE_REAL_FLUTTER=$FLUTTER_ROOT/bin/flutter" >> "$GITHUB_ENV"
          echo "/tmp/scdrive-flutter-wrap" >> "$GITHUB_PATH"

      - name: Reconstruct verified v1.7.5 base
        shell: bash
        run: |
          set -euxo pipefail
          run_v175_step() {
            ruby -ryaml -e 'y=YAML.load_file(ARGV[0]); n=ARGV[1]; s=y["jobs"]["android"]["steps"].find{|x|x["name"]==n}; abort("missing #{n}") unless s&&s["run"]; print s["run"]' .github/workflows/sc-drive-v175-gforce.yml "$1" >/tmp/v175-step.sh
            bash /tmp/v175-step.sh
          }
          run_v175_step 'Reconstruct verified v1.7.4 base'
          run_v175_step 'Apply realtime longitudinal G-force overlay'
          grep -n '^version: 1.7.5+25' scdrive-app/pubspec.yaml

      - name: Apply v1.8.0 adaptive foundation overlay
        shell: bash
        run: |
          set -euxo pipefail
          cat build-assets/v180-adaptive-s/{00,01p0,01p1,01p2,01p3,01p4,02,03p0,03p1,03p2,03p3,03p4,04,05,06}.b64 > /tmp/v180.b64
          echo '8b08718a05cf4dbb3909c8c8e8ff02956cace3bc73d66c1cee081de41d170b77  /tmp/v180.b64' | sha256sum -c -
          base64 -d /tmp/v180.b64 > /tmp/v180.tar.gz
          echo 'd650edef8928a6456b9e73c445d90a76997350b23223a14d0e798828eced4d89  /tmp/v180.tar.gz' | sha256sum -c -
          tar -xzf /tmp/v180.tar.gz -C scdrive-app
          cd scdrive-app
          test -f assets/fonts/NissanBrand-Regular.otf
          test -f assets/fonts/NissanBrand-Bold.otf
          grep -n '^version: 1.8.0+26' pubspec.yaml
          test -f android/app/src/main/kotlin/com/scdeport/scdrive/speed/ObservationModels.kt
          test -f android/app/src/main/kotlin/com/scdeport/scdrive/speed/AdaptiveProfileStore.kt
          test -f android/app/src/main/kotlin/com/scdeport/scdrive/speed/AdaptiveLearningModels.kt
          test -f android/app/src/main/kotlin/com/scdeport/scdrive/speed/VehicleSpeedState.kt
          test -f lib/widgets/speed_debug_overlay.dart

      - name: Resolve dependencies offline
        working-directory: scdrive-app
        run: flutter pub get --offline

      - name: Strict Flutter analyze
        id: flutter_analyze
        continue-on-error: true
        working-directory: scdrive-app
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee ../flutter-analyze.txt

      - name: Upload analyzer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SC-Drive-v1.8.0-Flutter-Analyze
          path: flutter-analyze.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce analyzer gate
        if: steps.flutter_analyze.outcome == 'failure'
        run: exit 1

      - name: Build release candidate
        working-directory: scdrive-app
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          SC_DRIVE_ALLOW_TEST_SIGNING: '1'
        run: |
          set -euxo pipefail
          flutter build apk --release \
            --dart-define=SPOTIFY_CLIENT_ID="${SPOTIFY_CLIENT_ID:-}" \
            --dart-define=SC_DRIVE_BUILD_PROFILE=production

      - name: Verify candidate
        shell: bash
        run: |
          set -euxo pipefail
          APK=scdrive-app/build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -c -P 16 -v 4 "$APK" >/dev/null
          unzip -l "$APK" | grep 'assets/flutter_assets/assets/fonts/NissanBrand-Regular.otf'
          unzip -l "$APK" | grep 'assets/flutter_assets/assets/fonts/NissanBrand-Bold.otf'
          grep -n '^version: 1.8.0+26' scdrive-app/pubspec.yaml
          mkdir -p out/lib
          cp "$APK" out/SC_Drive-v1.8.0-Adaptive-Foundation-CANDIDATE.apk
          cp "$BT/apksigner" out/apksigner
          cp "$BT/zipalign" out/zipalign
          cp "$BT/aapt" out/aapt
          cp "$BT/lib/apksigner.jar" out/lib/apksigner.jar
          chmod +x out/apksigner out/zipalign out/aapt
          "$BT/aapt" dump badging "$APK" | tee out/badging.txt
          grep -q "package: name='com.scdeport.scdrive' versionCode='26' versionName='1.8.0'" out/badging.txt
          sha256sum "$APK" > out/candidate.sha256
          cat > out/BUILD-VERIFICATION.txt <<'EOF'
          SC Drive v1.8.0+26 Adaptive Foundation
          Flutter 3.35.7: ENABLED
          Flutter analyze: PASS
          Release build: PASS
          APK ZIP integrity: PASS
          16 KB zipalign: PASS
          Verified v1.7.5 vehicle velocity + longitudinal G baseline: PRESERVED
          Unified SpeedObservation / MotionObservation: ENABLED
          Measurement timestamp vs receive timestamp separation: ENABLED
          Monotonic time-alignment foundation: ENABLED
          Bounded realtime observation ring buffers: ENABLED
          Event learning-eligibility gate: ENABLED
          Explicit learning rejection reasons: ENABLED
          Adaptive sensor profile persistence: ENABLED
          Accel/brake gain automatic promotion: DISABLED / SHADOW-ONLY FOUNDATION
          Existing OBD hardware gate: PRESERVED
          CI contains placeholder Nissan Brand bytes only; production fonts are injected during finalization.
          Google Maps deployment configuration: supplied from repository production secret during build.
          Spotify Client ID: supplied from repository production secret during AOT build.
          Physical head-unit / road verification: REQUIRED.
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: SC-Drive-v1.8.0-Adaptive-Foundation-CANDIDATE
          path: out/**
          if-no-files-found: error
          retention-days: 7
