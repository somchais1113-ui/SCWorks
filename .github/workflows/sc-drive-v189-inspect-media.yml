name: Inspect SC Drive v1.8.8 Media Source

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/sc-drive-v189-inspect-media.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sc-drive-apk-build
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Reconstruct v1.8.8 source
        shell: bash
        run: |
          set -euxo pipefail
          git fetch --depth=1 origin main
          rm -rf "$PUB_CACHE/hosted/pub.dev/flutter_carplay-1.6.4" || true
          ruby -ryaml -e 'y=YAML.load_file(ARGV[0]); n=ARGV[1]; s=y["jobs"]["android-final"]["steps"].find{|x|x["name"]==n}; abort("missing #{n}") unless s&&s["run"]; print s["run"]' .github/workflows/sc-drive-v182-final-sign.yml 'Reconstruct exact v1.8.2 source' >/tmp/base.sh
          bash /tmp/base.sh
          git show origin/main:.github/workflows/sc-drive-v187-camera-awareness-latest.yml > /tmp/v187.yml
          ruby -ryaml -e 'y=YAML.load_file(ARGV[0]); n=ARGV[1]; s=y["jobs"]["android"]["steps"].find{|x|x["name"]==n}; abort("missing #{n}") unless s&&s["run"]; print s["run"]' /tmp/v187.yml 'Apply Camera Awareness and Drive Dynamics overlays' >/tmp/v187-camera-dynamics.sh
          bash /tmp/v187-camera-dynamics.sh
          ruby -ryaml -e 'y=YAML.load_file(ARGV[0]); n=ARGV[1]; s=y["jobs"]["android"]["steps"].find{|x|x["name"]==n}; abort("missing #{n}") unless s&&s["run"]; print s["run"]' /tmp/v187.yml 'Apply Radio Garden companion overlay' >/tmp/v187-radio.sh
          bash /tmp/v187-radio.sh
          ruby -ryaml -e 'y=YAML.load_file(ARGV[0]); n=ARGV[1]; s=y["jobs"]["android"]["steps"].find{|x|x["name"]==n}; abort("missing #{n}") unless s&&s["run"]; print s["run"]' /tmp/v187.yml 'Lock Camera Awareness into latest build and bump v1.8.7' >/tmp/v187-lock.sh
          bash /tmp/v187-lock.sh
          mkdir -p build-assets/v188
          git show origin/main:build-assets/v188/camera_awareness_service.dart > build-assets/v188/camera_awareness_service.dart
          git show origin/main:build-assets/v188/radio_garden_panel.dart > build-assets/v188/radio_garden_panel.dart
          git show origin/main:build-assets/v188/apply-v188.sh > build-assets/v188/apply-v188.sh
          chmod +x build-assets/v188/apply-v188.sh
          bash build-assets/v188/apply-v188.sh
          grep -n '^version: 1.8.8+34' scdrive-app/pubspec.yaml

      - name: Collect media source
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out/lib/features/head_unit out/lib/services out/lib/domain/spotify out/lib/widgets out/android/spotify out/android/root
          cp scdrive-app/lib/features/head_unit/head_unit_screen.dart out/lib/features/head_unit/
          cp scdrive-app/lib/features/head_unit/radio_garden_panel.dart out/lib/features/head_unit/
          cp scdrive-app/lib/services/spotify_service.dart out/lib/services/
          cp scdrive-app/lib/domain/spotify/spotify_models.dart out/lib/domain/spotify/
          cp scdrive-app/lib/widgets/spotify_live_progress.dart out/lib/widgets/
          cp scdrive-app/android/app/src/main/kotlin/com/scdeport/scdrive/spotify/*.kt out/android/spotify/
          cp scdrive-app/android/app/src/main/kotlin/com/scdeport/scdrive/MainActivity.kt out/android/root/
          cp scdrive-app/android/app/src/main/AndroidManifest.xml out/android/root/
          cp scdrive-app/pubspec.yaml out/
          find scdrive-app/lib -type f | grep -Ei 'spotify|media|radio' > out/media-files.txt || true
          grep -RniE 'spotify|open.spotify|url_launcher|launchUrl' scdrive-app/lib/features/head_unit scdrive-app/lib/services/spotify_service.dart > out/media-grep.txt || true

      - uses: actions/upload-artifact@v4
        with:
          name: SC-Drive-v1.8.8-Media-Source-Inspect
          path: out/**
          if-no-files-found: error
          retention-days: 3

      - name: Publish inspect pointer
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin sc-drive-apk-build
          git checkout -B sc-drive-apk-build origin/sc-drive-apk-build
          mkdir -p build-status
          cat > build-status/sc-drive-v189-media-inspect.txt <<EOF
          STATUS=${{ job.status }}
          RUN_ID=$GITHUB_RUN_ID
          SOURCE_SHA=$GITHUB_SHA
          ARTIFACT_NAME=SC-Drive-v1.8.8-Media-Source-Inspect
          EOF
          git config user.name 'SC Drive Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add build-status/sc-drive-v189-media-inspect.txt
          git commit -m 'publish v1.8.9 media inspect pointer [skip ci]' || true
          git push origin HEAD:sc-drive-apk-build || true
