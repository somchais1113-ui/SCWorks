name: Build SC Drive v1.6.3 Phone Car GPS ODO

on:
  push:
    branches: [ sc-drive-apk-build ]
    paths:
      - '.github/workflows/sc-drive-v163-build.yml'
      - 'build-assets/v163-patch-v2/**'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Reconstruct v1.6.0 verified base
        shell: bash
        run: |
          set -euxo pipefail
          run_step() {
            ruby -ryaml -e 'y=YAML.load_file(ARGV[0]); n=ARGV[1]; s=y["jobs"]["android"]["steps"].find{|x|x["name"]==n}; abort("missing #{n}") unless s&&s["run"]; print s["run"]' .github/workflows/sc-drive-v160-speed-engine.yml "$1" >/tmp/v160-step.sh
            bash /tmp/v160-step.sh
          }
          run_step 'Reconstruct verified v1.5.6 baseline'
          run_step 'Apply native GNSS IMU VehicleSpeedEngine'
          grep -n '^version: 1.6.0+14' scdrive-app/pubspec.yaml

      - name: Apply v1.6.3 feature patch
        shell: bash
        run: |
          set -euxo pipefail
          cat build-assets/v163-patch-v2/{00,01,02,03,04,05,06,07,08,09,10}.b64 >/tmp/v163.b64
          echo '1115b9268b4ebc76390d29996991a75ef1f5e1cc3407771f5ba61c1e206db3f9  /tmp/v163.b64' | sha256sum -c -
          base64 -d /tmp/v163.b64 >/tmp/v163.patch.gz
          echo '59340a8cfb94d46bdb373139366e21d7bbfd109102a01caa0f8c5a4228790e8b  /tmp/v163.patch.gz' | sha256sum -c -
          gzip -dc /tmp/v163.patch.gz >/tmp/v163.patch.raw
          python3 - <<'PY'
          from pathlib import Path
          text=Path('/tmp/v163.patch.raw').read_text()
          parts=text.split('diff -ruN ')
          kept=[parts[0]]
          for part in parts[1:]:
              header=part.splitlines()[0] if part.splitlines() else ''
              if 'patchbase/pubspec.lock' in header:
                  continue
              kept.append('diff -ruN '+part)
          Path('/tmp/v163.patch').write_text(''.join(kept))
          PY
          cd scdrive-app
          set +e
          patch -p1 --batch --forward </tmp/v163.patch
          PATCH_STATUS=$?
          set -e
          # CI reconstruction differs slightly from the archived v1.6.0 source.
          # Only two known head_unit_screen.dart hunks may reject; preserve the
          # semantic changes explicitly and reject anything else.
          if [[ $PATCH_STATUS -ne 0 ]]; then
            test -f lib/features/head_unit/head_unit_screen.dart.rej
            grep -q "package:flutter/scheduler.dart" lib/features/head_unit/head_unit_screen.dart.rej
            grep -q "child: Text" lib/features/head_unit/head_unit_screen.dart.rej
            test "$(find . -name '*.rej' | wc -l)" -eq 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/features/head_unit/head_unit_screen.dart')
          s=p.read_text()
          if "import 'package:flutter/scheduler.dart';" not in s:
              s=s.replace("import 'package:flutter/material.dart';\n", "import 'package:flutter/material.dart';\nimport 'package:flutter/scheduler.dart';\n")
          if "../../services/drive_data_service.dart" not in s:
              s=s.replace("import '../../services/drive_telemetry_service.dart';\n", "import '../../services/drive_telemetry_service.dart';\nimport '../../services/drive_data_service.dart';\n")
          if "../../widgets/spotify_live_progress.dart" not in s:
              s=s.replace("import '../../widgets/speed_debug_overlay.dart';\n", "import '../../widgets/speed_debug_overlay.dart';\nimport '../../widgets/spotify_live_progress.dart';\n")
          # The CI base already has one driveData constructor in a nested dialog,
          # so target HeadUnitScreen specifically instead of checking globally.
          needle = """  const HeadUnitScreen({\n    required this.spotify,\n    required this.telemetry,\n"""
          repl = """  const HeadUnitScreen({\n    required this.spotify,\n    required this.telemetry,\n    required this.driveData,\n"""
          if repl not in s:
              if needle not in s:
                  raise SystemExit('HeadUnitScreen constructor marker missing')
              s=s.replace(needle, repl, 1)
          # Remove imports made obsolete by the new frame-synced instrument code.
          s=s.replace("import '../../domain/teana_j32_powertrain.dart';\n", '')
          s=s.replace("import '../../domain/spotify/spotify_models.dart';\n", '')
          p.write_text(s)
          rej=Path('lib/features/head_unit/head_unit_screen.dart.rej')
          if rej.exists(): rej.unlink()
          PY
          mkdir -p assets/fonts
          test -f assets/fonts/NissanOpti.otf || printf '\0' > assets/fonts/NissanOpti.otf
          test -f assets/fonts/NissanOpti-Italic.otf || printf '\0' > assets/fonts/NissanOpti-Italic.otf
          grep -n '^version: 1.6.3+17' pubspec.yaml
          grep -n 'transferPlaybackToDevice' lib/services/spotify_service.dart
          grep -n 'class DriveDataService' lib/services/drive_data_service.dart
          grep -n 'GPS COASTING' lib/services/drive_telemetry_service.dart
          sed -n '18,36p' lib/features/head_unit/head_unit_screen.dart
          test -z "$(find . -name '*.rej' -print -quit)"

      - name: Resolve dependencies
        working-directory: scdrive-app
        run: flutter pub get

      - name: Apply safe Dart analyzer fixes
        working-directory: scdrive-app
        run: dart fix --apply

      - name: Strict analyze
        working-directory: scdrive-app
        run: flutter analyze

      - name: Build release candidate
        working-directory: scdrive-app
        env:
          GOOGLE_MAPS_API_KEY: AIza00000000000000000000000000000000000
          SC_DRIVE_ALLOW_TEST_SIGNING: '1'
        run: |
          flutter build apk --release \
            --dart-define=SPOTIFY_CLIENT_ID=00000000000000000000000000000000 \
            --dart-define=SC_DRIVE_BUILD_PROFILE=production

      - name: Verify candidate and export signing tools
        shell: bash
        run: |
          set -euxo pipefail
          APK=scdrive-app/build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          mkdir -p out/tools/lib
          cp "$APK" out/SC_Drive-v1.6.3-CI-DUMMY-CONFIG.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          cp "$BT/apksigner" out/tools/apksigner
          cp "$BT/zipalign" out/tools/zipalign
          cp "$BT/lib/apksigner.jar" out/tools/lib/apksigner.jar
          chmod +x out/tools/apksigner out/tools/zipalign
          "$BT/zipalign" -c -P 16 -v 4 "$APK" >/dev/null
          sha256sum "$APK" > out/candidate.sha256
          tar -czf out/SC_Drive-v1.6.3-CI-Source.tar.gz -C scdrive-app .

      - uses: actions/upload-artifact@v4
        with:
          name: SC-Drive-v1.6.3-CANDIDATE
          path: out/**
          if-no-files-found: error
          retention-days: 7
