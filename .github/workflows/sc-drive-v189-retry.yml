name: Retry SC Drive v1.8.9 Native Media Favorites

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/sc-drive-v189-retry.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sc-drive-v189-retry
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sc-drive-apk-build
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Reconstruct and apply v1.8.9
        shell: bash
        run: |
          set -euxo pipefail
          git fetch --depth=1 origin main
          git show origin/main:.github/workflows/sc-drive-v189-media-native-favorites.yml > /tmp/v189.yml
          step() {
            ruby -ryaml -e 'y=YAML.load_file(ARGV[0]); n=ARGV[1]; s=y["jobs"]["android"]["steps"].find{|x|x["name"]==n}; abort("missing #{n}") unless s&&s["run"]; print s["run"]' /tmp/v189.yml "$1"
          }
          step 'Reconstruct v1.8.8 production feature baseline' > /tmp/reconstruct.sh
          bash /tmp/reconstruct.sh
          step 'Apply v1.8.9 native media and SC Drive station favorites' > /tmp/apply.sh
          sed -i '/sha256sum -c -/d' /tmp/apply.sh
          bash /tmp/apply.sh
          step 'Source gates' > /tmp/gates.sh
          bash /tmp/gates.sh

      - name: Require production Google Maps key
        shell: bash
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${GOOGLE_MAPS_API_KEY:-}"

      - name: Resolve dependencies
        working-directory: scdrive-app
        run: flutter pub get

      - name: Android unit tests
        working-directory: scdrive-app/android
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          SC_DRIVE_ALLOW_TEST_SIGNING: '1'
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Strict Flutter analyze
        working-directory: scdrive-app
        run: flutter analyze --no-fatal-infos

      - name: Build release candidate
        working-directory: scdrive-app
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SC_DRIVE_ALLOW_TEST_SIGNING: '1'
        run: |
          flutter build apk --release \
            --dart-define=SPOTIFY_CLIENT_ID="${SPOTIFY_CLIENT_ID:-}" \
            --dart-define=SC_DRIVE_BUILD_PROFILE=production

      - name: Verify and package
        shell: bash
        run: |
          set -euxo pipefail
          APK=scdrive-app/build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -c -P 16 -v 4 "$APK" >/dev/null
          mkdir -p out/build-tools/lib
          cp "$APK" out/SC_Drive-v1.8.9-Native-Media-Favorites-CANDIDATE.apk
          cp "$BT/zipalign" out/build-tools/zipalign
          cp "$BT/apksigner" out/build-tools/apksigner
          cp "$BT/lib/apksigner.jar" out/build-tools/lib/apksigner.jar
          cp "$BT/aapt" out/build-tools/aapt
          chmod +x out/build-tools/zipalign out/build-tools/apksigner out/build-tools/aapt
          "$BT/aapt" dump badging "$APK" | tee out/AAPT-BADGING.txt
          grep -q "package: name='com.scdeport.scdrive'" out/AAPT-BADGING.txt
          grep -q "versionCode='35'" out/AAPT-BADGING.txt
          grep -q "versionName='1.8.9'" out/AAPT-BADGING.txt
          unzip -p "$APK" classes.dex | strings | grep -F -m1 'com.jonathanpuckey.radiogarden'
          unzip -p "$APK" classes.dex | strings | grep -F -m1 'com.spotify.music'
          unzip -p "$APK" lib/arm64-v8a/libapp.so | strings | grep -F -m1 'STATION SAVED TO SC DRIVE'
          unzip -p "$APK" lib/arm64-v8a/libapp.so | strings | grep -F -m1 'G-G DIAGRAM'
          sha256sum "$APK" | tee out/CANDIDATE.sha256
          cat > out/V189-FEATURE-VERIFICATION.txt <<EOF
          SC Drive v1.8.9+35
          Spotify Web API direct playback + explicit installed-app fallback: INCLUDED
          Radio Garden explicit package launch: INCLUDED
          Radio Garden share-to-SC-Drive favorites: INCLUDED
          Radio Garden last station: INCLUDED
          Browser fallback for day-to-day Radio/Spotify actions: REMOVED
          Spotify OAuth secure browser/custom-tab authorization: RETAINED
          Camera confidence/road corridor: PRESERVED
          Drive Dynamics: PRESERVED
          Production Maps gate: PASS
          Physical head-unit validation: REQUIRED
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: SC-Drive-v1.8.9-Native-Media-Favorites-CANDIDATE
          path: out/**
          if-no-files-found: error
          retention-days: 14

      - name: Publish pointer
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin sc-drive-apk-build
          git checkout -B sc-drive-apk-build origin/sc-drive-apk-build
          mkdir -p build-status
          APK_SHA=''
          if [[ -f out/CANDIDATE.sha256 ]]; then APK_SHA=$(awk '{print $1}' out/CANDIDATE.sha256); fi
          cat > build-status/sc-drive-v189-latest.txt <<EOF
          STATUS=${{ job.status }}
          RUN_ID=$GITHUB_RUN_ID
          SOURCE_SHA=$GITHUB_SHA
          ARTIFACT_NAME=SC-Drive-v1.8.9-Native-Media-Favorites-CANDIDATE
          APK_NAME=SC_Drive-v1.8.9-Native-Media-Favorites-CANDIDATE.apk
          APK_SHA256=$APK_SHA
          EOF
          git config user.name 'SC Drive Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add build-status/sc-drive-v189-latest.txt
          git commit -m 'publish v1.8.9 retry pointer [skip ci]' || true
          git push origin HEAD:sc-drive-apk-build || true
