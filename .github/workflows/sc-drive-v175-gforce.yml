name: Build SC Drive v1.7.5 Realtime Longitudinal G-Force

on:
  push:
    branches: [ sc-drive-apk-build ]
    paths:
      - '.github/workflows/sc-drive-v175-gforce.yml'
      - 'build-assets/v175-gforce-s/**'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Reconstruct verified v1.7.4 base
        shell: bash
        run: |
          set -euxo pipefail
          run_v174_step() {
            ruby -ryaml -e 'y=YAML.load_file(ARGV[0]); n=ARGV[1]; s=y["jobs"]["android"]["steps"].find{|x|x["name"]==n}; abort("missing #{n}") unless s&&s["run"]; print s["run"]' .github/workflows/sc-drive-v174-velocity-estimator.yml "$1" >/tmp/v174-step.sh
            bash /tmp/v174-step.sh
          }
          run_v174_step 'Reconstruct verified v1.7.3 base'
          run_v174_step 'Apply realtime vehicle velocity estimator overlay'
          grep -n '^version: 1.7.4+24' scdrive-app/pubspec.yaml

      - name: Apply realtime longitudinal G-force overlay
        shell: bash
        run: |
          set -euxo pipefail
          cat build-assets/v175-gforce-s/{00,01,02,03,04,05}.b64 > /tmp/v175.b64
          echo '05ce593039d0eb57914c3a03ac5e98e9fb36bce57740ef9696383385e1f269c0  /tmp/v175.b64' | sha256sum -c -
          base64 -d /tmp/v175.b64 > /tmp/v175.tar.gz
          echo '3273b936d40cf763922c43a8a3a536d60bbe9cb760d29e1b6255e11e1b6b9dfd  /tmp/v175.tar.gz' | sha256sum -c -
          tar -xzf /tmp/v175.tar.gz -C scdrive-app
          cd scdrive-app
          test -f assets/fonts/NissanBrand-Regular.otf
          test -f assets/fonts/NissanBrand-Bold.otf
          dart format lib/features/head_unit/drive_deck_panel.dart lib/services/drive_data_service.dart lib/services/drive_telemetry_service.dart lib/widgets/speed_debug_overlay.dart
          grep -n '^version: 1.7.5+25' pubspec.yaml
          grep -n 'class VehicleDynamicsEngine' android/app/src/main/kotlin/com/scdeport/scdrive/speed/VehicleDynamicsEngine.kt
          grep -n 'class ImuRateTracker' android/app/src/main/kotlin/com/scdeport/scdrive/speed/ImuRateTracker.kt
          grep -n 'fun resetTripDynamics' android/app/src/main/kotlin/com/scdeport/scdrive/speed/VehicleSpeedEngine.kt
          grep -n 'resetTripDynamics' android/app/src/main/kotlin/com/scdeport/scdrive/MainActivity.kt
          grep -n 'tripPeakPositiveG' android/app/src/main/kotlin/com/scdeport/scdrive/speed/VehicleSpeedState.kt
          grep -n 'requestedImuRateHz' android/app/src/main/kotlin/com/scdeport/scdrive/speed/VehicleImuProvider.kt
          grep -n 'forwardAccelerationMps2' android/app/src/main/kotlin/com/scdeport/scdrive/speed/VehicleSpeedEngine.kt
          grep -n 'lastDynamicsEventId' lib/services/drive_data_service.dart

      - name: Resolve dependencies
        working-directory: scdrive-app
        run: flutter pub get

      - name: Apply safe Dart analyzer fixes
        working-directory: scdrive-app
        run: dart fix --apply

      - name: Strict Flutter analyze
        working-directory: scdrive-app
        run: flutter analyze

      - name: Build release candidate
        working-directory: scdrive-app
        env:
          GOOGLE_MAPS_API_KEY: AIza00000000000000000000000000000000000
          SC_DRIVE_ALLOW_TEST_SIGNING: '1'
        run: |
          set -euxo pipefail
          flutter build apk --release --dart-define=SC_DRIVE_BUILD_PROFILE=production

      - name: Verify candidate
        shell: bash
        run: |
          set -euxo pipefail
          APK=scdrive-app/build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -c -P 16 -v 4 "$APK" >/dev/null
          unzip -l "$APK" | grep 'assets/flutter_assets/assets/fonts/NissanBrand-Regular.otf'
          unzip -l "$APK" | grep 'assets/flutter_assets/assets/fonts/NissanBrand-Bold.otf'
          grep -n '^version: 1.7.5+25' scdrive-app/pubspec.yaml
          mkdir -p out/lib
          cp "$APK" out/SC_Drive-v1.7.5-Realtime-Longitudinal-GForce-CANDIDATE.apk
          cp "$BT/apksigner" out/apksigner
          cp "$BT/zipalign" out/zipalign
          cp "$BT/lib/apksigner.jar" out/lib/apksigner.jar
          chmod +x out/apksigner out/zipalign
          sha256sum "$APK" > out/candidate.sha256
          cat > out/BUILD-VERIFICATION.txt <<'EOF'
          SC Drive v1.7.5+25 Realtime Longitudinal G-Force Engine
          Flutter analyze: PASS
          Release build: PASS
          APK ZIP integrity: PASS
          16 KB zipalign: PASS
          Realtime longitudinal G-force engine: ENABLED
          Raw Android accelerometer axes are not directly displayed as vehicle G: VERIFIED BY ARCHITECTURE
          Actual IMU callback-rate detector: ENABLED
          Monotonic IMU timestamps: ENABLED
          Vehicle-axis processing and gravity compensation: ENABLED
          Adaptive accelerometer bias/noise handling: ENABLED
          Same corrected longitudinal acceleration feeds VehicleVelocityEstimator and VehicleDynamicsEngine: ENABLED
          Live longitudinal G and velocity-derived validation G: ENABLED
          Validated Trip Peak +G / Peak Brake: ENABLED
          Road-impact / pothole rejection: ENABLED
          Acceleration/braking event state machine with duration + hysteresis: ENABLED
          Structured driving events and Trip Analytics counters: ENABLED
          Developer diagnostics + expanded CSV telemetry: ENABLED
          OBD architecture: PRESERVED
          OBD speed/G validation fusion: NOT ENABLED; future source only
          CI contains placeholder Nissan Brand bytes only; user-provided Nissan Brand fonts are injected locally before permanent signing.
          CI contains placeholder Maps configuration only; production deployment configuration is injected locally before permanent signing.
          Physical head-unit / road verification: REQUIRED.
          IMPLEMENTED BUT NOT YET PHYSICALLY VERIFIED.
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: SC-Drive-v1.7.5-Realtime-Longitudinal-GForce-CANDIDATE
          path: out/**
          if-no-files-found: error
          retention-days: 7
