name: Export Android Build Tools Runtime

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/scdrive-buildtools-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sc-drive-apk-build
      - name: Publish pointer
        shell: bash
        run: |
          mkdir -p build-status
          cat > build-status/buildtools-runtime.txt <<EOF
          STATUS=running
          RUN_ID=$GITHUB_RUN_ID
          EOF
          git config user.name 'SC Drive Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add build-status/buildtools-runtime.txt
          git commit -m 'publish buildtools runtime pointer [skip ci]' || true
          git push origin HEAD:sc-drive-apk-build || true
      - name: Package runtime
        shell: bash
        run: |
          set -euxo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p out/lib64
          cp "$BT/lib64/libc++.so" out/lib64/libc++.so
          cp "$BT/zipalign" out/zipalign
          chmod +x out/zipalign
      - uses: actions/upload-artifact@v4
        with:
          name: android-buildtools-runtime
          path: out/**
          retention-days: 14
      - name: Publish final pointer
        if: always()
        shell: bash
        run: |
          cat > build-status/buildtools-runtime.txt <<EOF
          STATUS=${{ job.status }}
          RUN_ID=$GITHUB_RUN_ID
          EOF
          git add build-status/buildtools-runtime.txt
          git commit -m 'publish buildtools runtime result [skip ci]' || true
          git pull --rebase origin sc-drive-apk-build || true
          git push origin HEAD:sc-drive-apk-build || true
