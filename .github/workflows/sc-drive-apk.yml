name: Build SC Drive APK

on:
  push:
    branches: [ sc-drive-apk-build ]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.35.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Reconstruct verified SC Drive source
        shell: bash
        run: |
          set -euxo pipefail
          cat build-assets/scdrive-src/{00,01,02,03,04,05,06,07}.b64 > /tmp/scdrive-src.b64
          base64 -d /tmp/scdrive-src.b64 > /tmp/scdrive-src.tar.gz
          echo '8c52e682bd9c76af7e11dfd153a04809c7a36d5edd79a1b58df52e3cec4aef6c  /tmp/scdrive-src.tar.gz' | sha256sum -c -
          rm -rf /tmp/scdrive-unpack
          mkdir -p /tmp/scdrive-unpack
          tar -xzf /tmp/scdrive-src.tar.gz -C /tmp/scdrive-unpack
          test -f /tmp/scdrive-unpack/scdrive_headunit_bundle/pubspec.yaml

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Generate Android scaffold
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf scdrive-app
          flutter create --platforms=android --org com.scdeport --project-name sc_drive scdrive-app
          SRC=/tmp/scdrive-unpack/scdrive_headunit_bundle
          cp -a "$SRC/lib" scdrive-app/
          cp "$SRC/pubspec.yaml" scdrive-app/pubspec.yaml
          cp "$SRC/analysis_options.yaml" scdrive-app/analysis_options.yaml

          python3 - <<'PY'
          from pathlib import Path
          p = Path('scdrive-app/pubspec.yaml')
          s = p.read_text()
          old = '  flutter_carplay:\n    path: ../packages/flutter_carplay\n'
          if old not in s:
              raise SystemExit('flutter_carplay path dependency pattern not found')
          s = s.replace(old, '  flutter_carplay: ^1.6.4\n')
          s = s.replace('geolocator: ^14.0.3', 'geolocator: 14.0.2')
          p.write_text(s)

          g = Path('scdrive-app/android/app/build.gradle.kts')
          s = g.read_text()
          s = s.replace('com.scdeport.sc_drive', 'com.scdeport.scdrive')
          marker = '        versionName = flutter.versionName\n'
          if marker not in s:
              raise SystemExit('defaultConfig marker not found')
          s = s.replace(marker, marker + '        manifestPlaceholders["appAuthRedirectScheme"] = "scdrive-login"\n')
          g.write_text(s)
          PY

          SRC=/tmp/scdrive-unpack/scdrive_headunit_bundle
          cp "$SRC/android_overlay/AndroidManifest.xml" scdrive-app/android/app/src/main/AndroidManifest.xml
          rm -rf scdrive-app/android/app/src/main/kotlin/com/scdeport/sc_drive
          mkdir -p scdrive-app/android/app/src/main/kotlin/com/scdeport/scdrive
          cp "$SRC/android_overlay/MainActivity.kt" scdrive-app/android/app/src/main/kotlin/com/scdeport/scdrive/MainActivity.kt
          mkdir -p scdrive-app/android/app/src/main/res/xml
          cat > scdrive-app/android/app/src/main/res/xml/automotive_app_desc.xml <<'XML'
          <automotiveApp xmlns:android="http://schemas.android.com/apk/res/android">
              <uses name="template"/>
          </automotiveApp>
          XML

          grep -n 'geolocator\|flutter_carplay' scdrive-app/pubspec.yaml
          grep -n 'namespace\|applicationId\|appAuthRedirectScheme' scdrive-app/android/app/build.gradle.kts
          grep -n 'ACCESS_FINE_LOCATION\|category.HOME\|AndroidAutoService' scdrive-app/android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        working-directory: scdrive-app
        run: flutter pub get

      - name: Analyze
        working-directory: scdrive-app
        continue-on-error: true
        run: flutter analyze

      - name: Test if present
        working-directory: scdrive-app
        shell: bash
        run: |
          if [ -d test ] && find test -type f -name '*_test.dart' -print -quit | grep -q .; then
            flutter test
          else
            echo 'No Dart tests in this source package.'
          fi

      - name: Build release APK
        working-directory: scdrive-app
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
        shell: bash
        run: |
          set -euxo pipefail
          flutter build apk --release --dart-define=SPOTIFY_CLIENT_ID="${SPOTIFY_CLIENT_ID:-}"
          test -s build/app/outputs/flutter-apk/app-release.apk

      - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out
          cp scdrive-app/build/app/outputs/flutter-apk/app-release.apk out/SC_Drive-v1.4.0-gps-auto-headunit.apk
          sha256sum out/SC_Drive-v1.4.0-gps-auto-headunit.apk | tee out/SC_Drive-v1.4.0-gps-auto-headunit.apk.sha256
          ls -lh out/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SC-Drive-v1.4.0-APK
          path: out/*
          if-no-files-found: error
          retention-days: 14
