name: Build SC Drive APK

on:
  push:
    branches: [ sc-drive-apk-build ]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.35.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Reconstruct verified SC Drive source
        shell: bash
        run: |
          set -euxo pipefail
          cat build-assets/scdrive-src/{00,01,02,03,04,05,06,07}.b64 > /tmp/scdrive-src.b64
          base64 -d /tmp/scdrive-src.b64 > /tmp/scdrive-src.tar.gz
          echo '8c52e682bd9c76af7e11dfd153a04809c7a36d5edd79a1b58df52e3cec4aef6c  /tmp/scdrive-src.tar.gz' | sha256sum -c -
          rm -rf /tmp/scdrive-unpack
          mkdir -p /tmp/scdrive-unpack
          tar -xzf /tmp/scdrive-src.tar.gz -C /tmp/scdrive-unpack
          test -f /tmp/scdrive-unpack/scdrive_headunit_bundle/pubspec.yaml

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Generate Android scaffold and apply compatibility fixes
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf scdrive-app
          flutter create --platforms=android --org com.scdeport --project-name sc_drive scdrive-app
          SRC=/tmp/scdrive-unpack/scdrive_headunit_bundle
          cp -a "$SRC/lib" scdrive-app/
          cp "$SRC/pubspec.yaml" scdrive-app/pubspec.yaml
          cp "$SRC/analysis_options.yaml" scdrive-app/analysis_options.yaml
          rm -rf scdrive-app/test

          python3 - <<'PY'
          from pathlib import Path

          p = Path('scdrive-app/pubspec.yaml')
          s = p.read_text()
          old = '  flutter_carplay:\n    path: ../packages/flutter_carplay\n'
          if old not in s:
              raise SystemExit('flutter_carplay path dependency pattern not found')
          s = s.replace(old, '  flutter_carplay: ^1.6.4\n')
          s = s.replace('geolocator: ^14.0.3', 'geolocator: 14.0.2')
          p.write_text(s)

          head = Path('scdrive-app/lib/features/head_unit/head_unit_screen.dart')
          s = head.read_text()
          if 'Icons.rainy' in s:
              s = s.replace('Icons.rainy', 'Icons.water_drop_rounded')
          head.write_text(s)

          gps = Path('scdrive-app/lib/services/drive_telemetry_service.dart')
          s = gps.read_text()
          s = s.replace(
              'final rawSpeedMps = math.max(0, position.speed);',
              'final rawSpeedMps = math.max(0.0, position.speed).toDouble();',
          )
          gps.write_text(s)

          g = Path('scdrive-app/android/app/build.gradle.kts')
          s = g.read_text()
          s = s.replace('com.scdeport.sc_drive', 'com.scdeport.scdrive')
          marker = '        versionName = flutter.versionName\n'
          if marker not in s:
              raise SystemExit('defaultConfig marker not found')
          s = s.replace(marker, marker + '        manifestPlaceholders["appAuthRedirectScheme"] = "scdrive-login"\n')
          g.write_text(s)
          PY

          SRC=/tmp/scdrive-unpack/scdrive_headunit_bundle
          cp "$SRC/android_overlay/AndroidManifest.xml" scdrive-app/android/app/src/main/AndroidManifest.xml
          rm -rf scdrive-app/android/app/src/main/kotlin/com/scdeport/sc_drive
          mkdir -p scdrive-app/android/app/src/main/kotlin/com/scdeport/scdrive
          cp "$SRC/android_overlay/MainActivity.kt" scdrive-app/android/app/src/main/kotlin/com/scdeport/scdrive/MainActivity.kt
          mkdir -p scdrive-app/android/app/src/main/res/xml
          cat > scdrive-app/android/app/src/main/res/xml/automotive_app_desc.xml <<'XML'
          <automotiveApp xmlns:android="http://schemas.android.com/apk/res/android">
              <uses name="template"/>
          </automotiveApp>
          XML

      - name: Apply v1.4.1 smooth cluster patch
        shell: bash
        run: |
          set -euxo pipefail
          echo '862953f3847da94535df2b756b82f41827538677146c124fe7d338e54b946b2d  build-assets/scdrive-v141-simple.patch' | sha256sum -c -
          patch -p1 --forward --batch < build-assets/scdrive-v141-simple.patch
          grep -n '^version: 1.4.1+6' scdrive-app/pubspec.yaml

      - name: Apply v1.5.0 Nissan map deck patch
        shell: bash
        run: |
          set -euxo pipefail
          cat build-assets/v150-map/{00,01}.b64 > /tmp/scdrive-v150.patch.gz.b64
          base64 -d /tmp/scdrive-v150.patch.gz.b64 > /tmp/scdrive-v150.patch.gz
          echo '3bfea3d5be9cbeb77f4c3c48a0fe629e05510a8508872c101ae60829eff8b88e  /tmp/scdrive-v150.patch.gz' | sha256sum -c -
          gzip -dc /tmp/scdrive-v150.patch.gz > /tmp/scdrive-v150.patch
          echo 'dd4510fc503d79e4b039c8f160edf7a3c44c167dc4b341354ba760875093b420  /tmp/scdrive-v150.patch' | sha256sum -c -
          patch -p1 --forward --batch < /tmp/scdrive-v150.patch
          grep -n '^version: 1.5.0+7' scdrive-app/pubspec.yaml
          grep -n 'google_maps_flutter: 2.13.1' scdrive-app/pubspec.yaml
          grep -n 'class DriveDeckPanel' scdrive-app/lib/features/head_unit/drive_deck_panel.dart
          grep -n 'com.google.android.geo.API_KEY' scdrive-app/android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        working-directory: scdrive-app
        run: flutter pub get

      - name: Analyze
        working-directory: scdrive-app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        id: apk_build
        working-directory: scdrive-app
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        shell: bash
        run: |
          set +e
          set -o pipefail
          flutter build apk --release \
            --dart-define=SPOTIFY_CLIENT_ID="${SPOTIFY_CLIENT_ID:-}" \
            --dart-define=GOOGLE_MAPS_API_KEY="${GOOGLE_MAPS_API_KEY:-}" \
            2>&1 | tee ../build.log
          STATUS=${PIPESTATUS[0]}
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SC-Drive-v1.5.0-build-log
          path: build.log
          if-no-files-found: error
          retention-days: 14

      - name: Stop on build failure
        if: steps.apk_build.outputs.status != '0'
        run: exit 1

      - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail
          test -s scdrive-app/build/app/outputs/flutter-apk/app-release.apk
          mkdir -p out
          cp scdrive-app/build/app/outputs/flutter-apk/app-release.apk out/SC_Drive-v1.5.0-nissan-map-deck-headunit.apk
          sha256sum out/SC_Drive-v1.5.0-nissan-map-deck-headunit.apk | tee out/SC_Drive-v1.5.0-nissan-map-deck-headunit.apk.sha256
          ls -lh out/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SC-Drive-v1.5.0-Nissan-Map-Deck-APK
          path: out/*
          if-no-files-found: error
          retention-days: 14
