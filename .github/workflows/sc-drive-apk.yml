name: Build SC Drive APK

on:
  push:
    branches: [ sc-drive-apk-build ]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.35.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Recover and verify full SC Drive source
        shell: bash
        run: |
          set -euxo pipefail
          SRCFILE=build-assets/SC_Drive_v1.4.0_GPS_Auto_Offline_HeadUnit.zip
          file "$SRCFILE"
          rm -f /tmp/scdrive-source.zip

          if unzip -tqq "$SRCFILE" >/dev/null 2>&1; then
            cp "$SRCFILE" /tmp/scdrive-source.zip
          elif gzip -t "$SRCFILE" >/dev/null 2>&1; then
            gzip -dc "$SRCFILE" > /tmp/scdrive-source.zip
          else
            echo 'Source is neither ZIP nor gzip-wrapped ZIP'
            exit 2
          fi

          file /tmp/scdrive-source.zip
          echo '6093bb9fd31cf7192e4c01c59d650e4ac2c3569a5298df93fafd4570d38948c0  /tmp/scdrive-source.zip' | sha256sum -c -
          unzip -tqq /tmp/scdrive-source.zip
          rm -rf scdrive-src
          mkdir scdrive-src
          unzip -q /tmp/scdrive-source.zip -d scdrive-src
          test -f scdrive-src/app/pubspec.yaml
          test -f scdrive-src/packages/flutter_carplay/pubspec.yaml

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Restore Android Gradle wrapper
        working-directory: scdrive-src/app
        run: ./scripts/ensure_android_scaffold.sh

      - name: Get dependencies
        working-directory: scdrive-src/app
        run: flutter pub get

      - name: Analyze
        working-directory: scdrive-src/app
        continue-on-error: true
        run: flutter analyze

      - name: Test if present
        working-directory: scdrive-src/app
        shell: bash
        run: |
          if [ -d test ] && find test -type f -name '*_test.dart' -print -quit | grep -q .; then
            flutter test
          else
            echo 'No Dart tests in this package.'
          fi

      - name: Build release APK
        working-directory: scdrive-src/app
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
        shell: bash
        run: |
          set -euxo pipefail
          flutter build apk --release --dart-define=SPOTIFY_CLIENT_ID="${SPOTIFY_CLIENT_ID:-}"
          test -s build/app/outputs/flutter-apk/app-release.apk

      - name: Package and checksum APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out
          cp scdrive-src/app/build/app/outputs/flutter-apk/app-release.apk out/SC_Drive-v1.4.0-gps-auto-headunit.apk
          sha256sum out/SC_Drive-v1.4.0-gps-auto-headunit.apk | tee out/SC_Drive-v1.4.0-gps-auto-headunit.apk.sha256
          ls -lh out/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SC-Drive-v1.4.0-APK
          path: out/*
          if-no-files-found: error
          retention-days: 14
