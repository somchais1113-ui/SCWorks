name: Build SC Drive APK

on:
  push:
    branches: [ sc-drive-apk-build ]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.35.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Reconstruct verified base source
        shell: bash
        run: |
          set -euxo pipefail
          cat build-assets/scdrive-src/{00,01,02,03,04,05,06,07}.b64 > /tmp/scdrive-src.b64
          base64 -d /tmp/scdrive-src.b64 > /tmp/scdrive-src.tar.gz
          echo '8c52e682bd9c76af7e11dfd153a04809c7a36d5edd79a1b58df52e3cec4aef6c  /tmp/scdrive-src.tar.gz' | sha256sum -c -
          rm -rf /tmp/scdrive-unpack
          mkdir -p /tmp/scdrive-unpack
          tar -xzf /tmp/scdrive-src.tar.gz -C /tmp/scdrive-unpack
          test -f /tmp/scdrive-unpack/scdrive_headunit_bundle/pubspec.yaml

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Generate Android scaffold
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf scdrive-app
          flutter create --platforms=android --org com.scdeport --project-name sc_drive scdrive-app
          SRC=/tmp/scdrive-unpack/scdrive_headunit_bundle
          cp -a "$SRC/lib" scdrive-app/
          cp "$SRC/analysis_options.yaml" scdrive-app/analysis_options.yaml
          rm -rf scdrive-app/test
          rm -rf scdrive-app/android/app/src/main/kotlin/com/scdeport/sc_drive
          mkdir -p scdrive-app/android/app/src/main/kotlin/com/scdeport/scdrive
          cp "$SRC/android_overlay/MainActivity.kt" scdrive-app/android/app/src/main/kotlin/com/scdeport/scdrive/MainActivity.kt
          mkdir -p scdrive-app/android/app/src/main/res/xml
          cat > scdrive-app/android/app/src/main/res/xml/automotive_app_desc.xml <<'XML'
          <automotiveApp xmlns:android="http://schemas.android.com/apk/res/android">
              <uses name="template"/>
          </automotiveApp>
          XML

      - name: Apply verified v1.5.0 full overlay
        shell: bash
        run: |
          set -euxo pipefail
          cat build-assets/v150-overlay/{00,01,02}.b64 > /tmp/scdrive-v150-overlay.b64
          base64 -d /tmp/scdrive-v150-overlay.b64 > /tmp/scdrive-v150-overlay.tar.gz
          echo '4bf7a4f0676aeb4ec63622ec3f657e2452e931284a756c2f77884fb73ad493f3  /tmp/scdrive-v150-overlay.tar.gz' | sha256sum -c -
          tar -xzf /tmp/scdrive-v150-overlay.tar.gz -C scdrive-app
          grep -n '^version: 1.5.0+7' scdrive-app/pubspec.yaml
          grep -n 'google_maps_flutter: 2.13.1' scdrive-app/pubspec.yaml
          grep -n 'class DriveDeckPanel' scdrive-app/lib/features/head_unit/drive_deck_panel.dart
          grep -n 'com.google.android.geo.API_KEY' scdrive-app/android/app/src/main/AndroidManifest.xml
          grep -n 'SC_DRIVE_KEYSTORE_PATH' scdrive-app/android/app/build.gradle.kts

      - name: Upgrade Kotlin for Google Maps
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scdrive-app/android/settings.gradle.kts')
          s = p.read_text()
          old = 'id("org.jetbrains.kotlin.android") version "2.1.0" apply false'
          new = 'id("org.jetbrains.kotlin.android") version "2.3.10" apply false'
          if old not in s:
              raise SystemExit('Expected Kotlin 2.1.0 plugin declaration not found')
          p.write_text(s.replace(old, new))
          PY
          grep -n 'org.jetbrains.kotlin.android' scdrive-app/android/settings.gradle.kts

      - name: Get dependencies
        working-directory: scdrive-app
        run: flutter pub get

      - name: Analyze
        working-directory: scdrive-app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        id: apk_build
        working-directory: scdrive-app
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        shell: bash
        run: |
          set +e
          set -o pipefail
          flutter build apk --release \
            --dart-define=SPOTIFY_CLIENT_ID="${SPOTIFY_CLIENT_ID:-}" \
            --dart-define=GOOGLE_MAPS_API_KEY="${GOOGLE_MAPS_API_KEY:-}" \
            2>&1 | tee ../build.log
          STATUS=${PIPESTATUS[0]}
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SC-Drive-v1.5.0-build-log
          path: build.log
          if-no-files-found: error
          retention-days: 14

      - name: Stop on build failure
        if: steps.apk_build.outputs.status != '0'
        run: exit 1

      - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail
          test -s scdrive-app/build/app/outputs/flutter-apk/app-release.apk
          mkdir -p out
          cp scdrive-app/build/app/outputs/flutter-apk/app-release.apk out/SC_Drive-v1.5.0-nissan-map-deck-headunit.apk
          sha256sum out/SC_Drive-v1.5.0-nissan-map-deck-headunit.apk | tee out/SC_Drive-v1.5.0-nissan-map-deck-headunit.apk.sha256
          ls -lh out/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SC-Drive-v1.5.0-Nissan-Map-Deck-APK
          path: out/*
          if-no-files-found: error
          retention-days: 14
