name: Diagnose SC Drive v1.8.1 OpenVehicle Gradle

on:
  workflow_dispatch:
  push:
    branches: [ sc-drive-apk-build ]
    paths:
      - '.github/workflows/sc-drive-v181-openvehicle-diagnostics.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Enable clean Flutter reconstruction
        shell: bash
        run: |
          set -euxo pipefail
          rm -f "$PUB_CACHE/credentials.json" "$HOME/.pub-cache/credentials.json" || true
          mkdir -p /tmp/scdrive-flutter-wrap
          cat > /tmp/scdrive-flutter-wrap/flutter <<'EOF'
          #!/usr/bin/env bash
          set -e
          REAL="${SC_DRIVE_REAL_FLUTTER:?}"
          if [[ "${1:-}" == "create" ]]; then
            shift
            exec "$REAL" create --no-pub "$@"
          fi
          if [[ "${1:-}" == "pub" && "${2:-}" == "get" ]]; then
            shift 2
            rm -f "${PUB_CACHE:-$HOME/.pub-cache}/credentials.json" "$HOME/.pub-cache/credentials.json" || true
            exec "$REAL" pub get "$@"
          fi
          exec "$REAL" "$@"
          EOF
          chmod +x /tmp/scdrive-flutter-wrap/flutter
          echo "SC_DRIVE_REAL_FLUTTER=$FLUTTER_ROOT/bin/flutter" >> "$GITHUB_ENV"
          echo "/tmp/scdrive-flutter-wrap" >> "$GITHUB_PATH"
      - name: Reconstruct v1.8.0 and apply current v1.8.1 overlay
        shell: bash
        run: |
          set -euxo pipefail
          run_v180_step() {
            ruby -ryaml -e 'y=YAML.load_file(ARGV[0]); n=ARGV[1]; s=y["jobs"]["android"]["steps"].find{|x|x["name"]==n}; abort("missing #{n}") unless s&&s["run"]; print s["run"]' .github/workflows/sc-drive-v180-adaptive-foundation.yml "$1" >/tmp/v180-step.sh
            bash /tmp/v180-step.sh
          }
          run_v180_step 'Reconstruct verified v1.7.5 base'
          run_v180_step 'Apply v1.8.0 adaptive foundation overlay'
          cat build-assets/v181-openvehicle-s/{00,01,02,03,04,05}.b64 > /tmp/v181.b64
          echo '2d775d4514e05e429364cf9ced1feb5aace0bc71f136100ab46c9b7edf43b051  /tmp/v181.b64' | sha256sum -c -
          base64 -d /tmp/v181.b64 > /tmp/v181.tar.gz
          echo 'eeed53cad00013676561e01f63a20565bf0d6e9c30da5f7d7cc9887002a9611b  /tmp/v181.tar.gz' | sha256sum -c -
          tar -xzf /tmp/v181.tar.gz -C scdrive-app
      - name: Resolve dependencies
        working-directory: scdrive-app
        run: |
          rm -f "$PUB_CACHE/credentials.json" "$HOME/.pub-cache/credentials.json" || true
          flutter pub get
      - name: Capture Android unit-test compiler output
        id: gradle_test
        continue-on-error: true
        working-directory: scdrive-app/android
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          SC_DRIVE_ALLOW_TEST_SIGNING: '1'
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --no-daemon --stacktrace --console=plain 2>&1 | tee ../../v181-gradle-test.log
      - name: Upload Gradle diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SC-Drive-v1.8.1-Gradle-Diagnostics
          path: v181-gradle-test.log
          if-no-files-found: error
          retention-days: 7
      - name: Enforce diagnostic result
        if: steps.gradle_test.outcome == 'failure'
        run: exit 1
