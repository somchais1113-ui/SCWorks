name: Build SC Drive v1.6.0 Speed Engine Release

on:
  workflow_dispatch:
  push:
    branches: [ sc-drive-apk-build ]
    paths: [ '.github/workflows/sc-drive-v160-speed-engine3.yml' ]

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.35.7', channel: stable, cache: true }

      - name: Reconstruct clean v1.6.0 source
        shell: bash
        run: |
          set -euxo pipefail
          ruby -ryaml -e 'y=YAML.load_file(ARGV[0]); s=y["jobs"]["android"]["steps"].find{|x|x["name"]=="Reconstruct v1.6.0 candidate source"}; abort("reconstruct step missing") unless s&&s["run"]; print s["run"]' .github/workflows/sc-drive-v160-speed-engine2.yml >/tmp/v160-clean.sh
          bash /tmp/v160-clean.sh
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scdrive-app/lib/features/head_unit/head_unit_screen.dart')
          s=p.read_text()
          marker='child: FittedBox('
          pos=s.find(marker)
          if pos < 0: raise SystemExit('FittedBox marker missing')
          tail=s[pos:]
          old='alignment: Alignment.center,\n'
          if old not in tail: raise SystemExit('redundant FittedBox alignment missing')
          tail=tail.replace(old,'',1)
          p.write_text(s[:pos]+tail)
          PY
          grep -n '^version: 1.6.0+14' scdrive-app/pubspec.yaml

      - name: Resolve dependencies
        working-directory: scdrive-app
        run: flutter pub get

      - name: Strict analyze
        working-directory: scdrive-app
        run: flutter analyze

      - name: Build release APK
        working-directory: scdrive-app
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          SC_DRIVE_ALLOW_TEST_SIGNING: '1'
        run: |
          flutter build apk --release \
            --dart-define=SPOTIFY_CLIENT_ID=c5d101a6669743f6ac6663b5a9c7d35a \
            --dart-define=SC_DRIVE_BUILD_PROFILE=production

      - name: Verify and package
        shell: bash
        run: |
          set -euxo pipefail
          APK=scdrive-app/build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          mkdir -p out/tools
          cp "$APK" out/SC_Drive-v1.6.0-CI-placeholder-font.apk
          sha256sum out/SC_Drive-v1.6.0-CI-placeholder-font.apk >out/SC_Drive-v1.6.0-CI-placeholder-font.apk.sha256
          tar -czf out/SC_Drive-v1.6.0-CI-Source.tar.gz -C scdrive-app .
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          cp "$BT/apksigner" out/tools/apksigner
          cp "$BT/zipalign" out/tools/zipalign
          chmod +x out/tools/*
          "$BT/zipalign" -c -P 16 -v 4 "$APK" >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: SC-Drive-v1.6.0-SPEED-ENGINE-RELEASE-CANDIDATE
          path: out/*
          if-no-files-found: error
          retention-days: 14
