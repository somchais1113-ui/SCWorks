name: Final SC Drive APK

on:
  push:
    branches: [ sc-drive-apk-build ]
    paths:
      - '.github/workflows/sc-drive-build-final.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sc-drive-apk-build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Prepare verified source
        shell: bash
        run: |
          set -euxo pipefail
          cat build-assets/scdrive-src/{00,01,02,03,04,05,06,07}.b64 > /tmp/scdrive-src.b64
          base64 -d /tmp/scdrive-src.b64 > /tmp/scdrive-src.tar.gz
          echo '8c52e682bd9c76af7e11dfd153a04809c7a36d5edd79a1b58df52e3cec4aef6c  /tmp/scdrive-src.tar.gz' | sha256sum -c -
          rm -rf /tmp/scdrive-unpack scdrive-app
          mkdir -p /tmp/scdrive-unpack
          tar -xzf /tmp/scdrive-src.tar.gz -C /tmp/scdrive-unpack
          flutter create --platforms=android --org com.scdeport --project-name sc_drive scdrive-app
          SRC=/tmp/scdrive-unpack/scdrive_headunit_bundle
          cp -a "$SRC/lib" scdrive-app/
          cp "$SRC/pubspec.yaml" scdrive-app/pubspec.yaml
          cp "$SRC/analysis_options.yaml" scdrive-app/analysis_options.yaml
          rm -rf scdrive-app/test

          python3 - <<'PY'
          from pathlib import Path
          p=Path('scdrive-app/pubspec.yaml')
          s=p.read_text()
          s=s.replace('  flutter_carplay:\n    path: ../packages/flutter_carplay\n','  flutter_carplay: ^1.6.4\n')
          s=s.replace('geolocator: ^14.0.3','geolocator: 14.0.2')
          p.write_text(s)

          h=Path('scdrive-app/lib/features/head_unit/head_unit_screen.dart')
          h.write_text(h.read_text().replace('Icons.rainy','Icons.water_drop_rounded'))

          d=Path('scdrive-app/lib/services/drive_telemetry_service.dart')
          d.write_text(d.read_text().replace('final rawSpeedMps = math.max(0, position.speed);','final rawSpeedMps = math.max(0.0, position.speed).toDouble();'))

          g=Path('scdrive-app/android/app/build.gradle.kts')
          s=g.read_text().replace('com.scdeport.sc_drive','com.scdeport.scdrive')
          marker='        versionName = flutter.versionName\n'
          s=s.replace(marker,marker+'        manifestPlaceholders["appAuthRedirectScheme"] = "scdrive-login"\n')
          g.write_text(s)
          PY

          cp "$SRC/android_overlay/AndroidManifest.xml" scdrive-app/android/app/src/main/AndroidManifest.xml
          rm -rf scdrive-app/android/app/src/main/kotlin/com/scdeport/sc_drive
          mkdir -p scdrive-app/android/app/src/main/kotlin/com/scdeport/scdrive
          cat > scdrive-app/android/app/src/main/kotlin/com/scdeport/scdrive/MainActivity.kt <<'KOTLIN'
          package com.scdeport.scdrive
          import io.flutter.embedding.android.FlutterActivity
          class MainActivity : FlutterActivity()
          KOTLIN

          mkdir -p scdrive-app/android/app/src/main/res/xml
          cat > scdrive-app/android/app/src/main/res/xml/automotive_app_desc.xml <<'XML'
          <automotiveApp xmlns:android="http://schemas.android.com/apk/res/android">
              <uses name="template"/>
          </automotiveApp>
          XML

          cd scdrive-app
          flutter pub get
          flutter analyze

      - name: Build APK
        id: build
        working-directory: scdrive-app
        shell: bash
        run: |
          set +e
          set -o pipefail
          flutter build apk --release --dart-define=SPOTIFY_CLIENT_ID= 2>&1 | tee ../final-build.log
          STATUS=${PIPESTATUS[0]}
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish result to build branch
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build-results
          cp final-build.log build-results/final-build.log
          printf 'status=%s\nrun=%s\n' '${{ steps.build.outputs.status }}' '${{ github.run_id }}' > build-results/final-status.txt
          if [ '${{ steps.build.outputs.status }}' = '0' ]; then
            cp scdrive-app/build/app/outputs/flutter-apk/app-release.apk build-results/SC_Drive-v1.4.0-gps-auto-headunit.apk
            sha256sum build-results/SC_Drive-v1.4.0-gps-auto-headunit.apk > build-results/SC_Drive-v1.4.0-gps-auto-headunit.apk.sha256
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-results/
          git commit -m 'Publish SC Drive APK build result [skip ci]' || true
          git push origin HEAD:sc-drive-apk-build

      - name: Fail if APK build failed
        if: steps.build.outputs.status != '0'
        run: exit 1
