name: Build SC Drive v1.8.4 Final Candidate

on:
  push:
    branches: [ sc-drive-apk-build ]
    paths:
      - '.github/workflows/sc-drive-v184-inspect.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sc-drive-v184-final-candidate
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Publish running pointer
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build-status
          cat > build-status/sc-drive-v184-tracked.txt <<EOF
          STATUS=running
          RUN_ID=$GITHUB_RUN_ID
          SOURCE_SHA=$GITHUB_SHA
          ARTIFACT_NAME=SC-Drive-v1.8.4-Camera-Hardened-FONT-READY-CANDIDATE
          APK_NAME=SC_Drive-v1.8.4-Camera-Hardened-FONT-READY-CANDIDATE.apk
          APK_SHA256=
          EOF
          git config user.name 'SC Drive Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add build-status/sc-drive-v184-tracked.txt
          git commit -m 'publish v1.8.4 running pointer [skip ci]' || true
          git push origin HEAD:sc-drive-apk-build || true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Reconstruct exact v1.8.2 source
        shell: bash
        run: |
          set -euxo pipefail
          ruby -ryaml -e 'y=YAML.load_file(ARGV[0]); n=ARGV[1]; s=y["jobs"]["android-final"]["steps"].find{|x|x["name"]==n}; abort("missing #{n}") unless s&&s["run"]; print s["run"]' .github/workflows/sc-drive-v182-final-sign.yml 'Reconstruct exact v1.8.2 source' >/tmp/v184-base.sh
          bash /tmp/v184-base.sh
          grep -n '^version: 1.8.2+28' scdrive-app/pubspec.yaml
          (cd scdrive-app && sha256sum -c /tmp/v181-physics-authority.sha256)

      - name: Apply v1.8.3 Camera Awareness overlay
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p scdrive-app/lib/features/camera
          cp build-assets/v183-camera/camera_models.dart scdrive-app/lib/features/camera/camera_models.dart
          cp build-assets/v183-camera/camera_repository.dart scdrive-app/lib/features/camera/camera_repository.dart
          cp build-assets/v183-camera/camera_awareness_service.dart scdrive-app/lib/features/camera/camera_awareness_service.dart
          patch -d scdrive-app -p1 --forward --batch < build-assets/v183-camera/drive-deck-camera.patch
          test -z "$(find scdrive-app -name '*.rej' -print -quit)"

      - name: Apply v1.8.4 hardening
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          pub=Path('scdrive-app/pubspec.yaml')
          s=pub.read_text()
          if 'version: 1.8.2+28' not in s:
              raise SystemExit('expected v1.8.2+28 baseline')
          pub.write_text(s.replace('version: 1.8.2+28','version: 1.8.4+30',1))

          repo=Path('scdrive-app/lib/features/camera/camera_repository.dart')
          s=repo.read_text()
          old='if (_records.isEmpty || centerLat == null || centerLon == null || synced == null) {'
          new='if (centerLat == null || centerLon == null || synced == null) {'
          if old not in s:
              raise SystemExit('camera refresh gate not found')
          s=s.replace(old,new,1)
          needle='  node["enforcement"="maxspeed"](around:${_syncRadiusMeters.round()},$latitude,$longitude);\n'
          if needle not in s:
              raise SystemExit('Overpass maxspeed query not found')
          s=s.replace(needle, needle+'  node["enforcement"="traffic_signals"](around:${_syncRadiusMeters.round()},$latitude,$longitude);\n',1)
          repo.write_text(s)

          svc=Path('scdrive-app/lib/features/camera/camera_awareness_service.dart')
          s=svc.read_text()
          if 'const Duration(seconds: 30)' not in s:
              raise SystemExit('camera retry interval not found')
          svc.write_text(s.replace('const Duration(seconds: 30)','const Duration(minutes: 2)',1))
          PY

          dart format \
            scdrive-app/lib/features/camera/camera_models.dart \
            scdrive-app/lib/features/camera/camera_repository.dart \
            scdrive-app/lib/features/camera/camera_awareness_service.dart \
            scdrive-app/lib/features/head_unit/drive_deck_panel.dart \
            scdrive-app/lib/features/head_unit/head_unit_screen.dart

          grep -n '^version: 1.8.4+30' scdrive-app/pubspec.yaml
          grep -q 'Duration(minutes: 2)' scdrive-app/lib/features/camera/camera_awareness_service.dart
          grep -q 'traffic_signals' scdrive-app/lib/features/camera/camera_repository.dart
          ! grep -q '_records.isEmpty || centerLat' scdrive-app/lib/features/camera/camera_repository.dart
          grep -q '_digitalSpeed >= 100' scdrive-app/lib/features/head_unit/head_unit_screen.dart
          grep -q 'target.round().clamp(0, 240)' scdrive-app/lib/features/head_unit/head_unit_screen.dart
          grep -q 'fit: BoxFit.scaleDown' scdrive-app/lib/features/head_unit/head_unit_screen.dart
          grep -q "fontFamily: 'NissanBrand'" scdrive-app/lib/features/head_unit/head_unit_screen.dart
          (cd scdrive-app && sha256sum -c /tmp/v181-physics-authority.sha256)

      - name: Require production Maps secret
        shell: bash
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${GOOGLE_MAPS_API_KEY:-}"
          echo 'Production Google Maps key present.'

      - name: Resolve dependencies
        working-directory: scdrive-app
        run: |
          rm -f "$PUB_CACHE/credentials.json" "$HOME/.pub-cache/credentials.json" || true
          flutter pub get

      - name: Android unit tests
        working-directory: scdrive-app/android
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          SC_DRIVE_ALLOW_TEST_SIGNING: '1'
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Strict Flutter analyze
        working-directory: scdrive-app
        run: flutter analyze --no-fatal-infos

      - name: Build release candidate with production Maps
        working-directory: scdrive-app
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SC_DRIVE_ALLOW_TEST_SIGNING: '1'
        run: |
          set -euxo pipefail
          flutter build apk --release \
            --dart-define=SPOTIFY_CLIENT_ID="${SPOTIFY_CLIENT_ID:-}" \
            --dart-define=SC_DRIVE_BUILD_PROFILE=production

      - name: Verify and package candidate
        shell: bash
        run: |
          set -euxo pipefail
          APK=scdrive-app/build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -c -P 16 -v 4 "$APK" >/dev/null
          mkdir -p out/build-tools/lib
          cp "$APK" out/SC_Drive-v1.8.4-Camera-Hardened-FONT-READY-CANDIDATE.apk
          cp "$BT/zipalign" out/build-tools/zipalign
          cp "$BT/apksigner" out/build-tools/apksigner
          cp "$BT/lib/apksigner.jar" out/build-tools/lib/apksigner.jar
          cp "$BT/aapt" out/build-tools/aapt
          chmod +x out/build-tools/zipalign out/build-tools/apksigner out/build-tools/aapt
          unzip -p "$APK" lib/arm64-v8a/libapp.so | strings | grep -F -m1 'CAMERA AHEAD'
          unzip -p "$APK" lib/arm64-v8a/libapp.so | strings | grep -F -m1 'OPENSTREETMAP'
          unzip -p "$APK" classes.dex | strings | grep -F -m1 'SYSTEM_RADIO_APP'
          "$BT/aapt" dump badging "$APK" | tee out/AAPT-BADGING.txt
          grep -q "package: name='com.scdeport.scdrive'" out/AAPT-BADGING.txt
          grep -q "versionCode='30'" out/AAPT-BADGING.txt
          grep -q "versionName='1.8.4'" out/AAPT-BADGING.txt
          unzip -p "$APK" assets/flutter_assets/FontManifest.json > out/FONT-MANIFEST-BEFORE-INJECTION.json
          sha256sum out/SC_Drive-v1.8.4-Camera-Hardened-FONT-READY-CANDIDATE.apk > out/CANDIDATE.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: SC-Drive-v1.8.4-Camera-Hardened-FONT-READY-CANDIDATE
          path: out/**
          if-no-files-found: error
          retention-days: 14

      - name: Publish final tracked pointer
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          APK_SHA=''
          if [[ -f out/CANDIDATE.sha256 ]]; then APK_SHA=$(cut -d' ' -f1 out/CANDIDATE.sha256); fi
          cat > build-status/sc-drive-v184-tracked.txt <<EOF
          STATUS=${{ job.status }}
          RUN_ID=$GITHUB_RUN_ID
          SOURCE_SHA=$GITHUB_SHA
          ARTIFACT_NAME=SC-Drive-v1.8.4-Camera-Hardened-FONT-READY-CANDIDATE
          APK_NAME=SC_Drive-v1.8.4-Camera-Hardened-FONT-READY-CANDIDATE.apk
          APK_SHA256=$APK_SHA
          EOF
          git add build-status/sc-drive-v184-tracked.txt
          git commit -m 'publish v1.8.4 tracked result [skip ci]' || true
          git pull --rebase origin sc-drive-apk-build || true
          git push origin HEAD:sc-drive-apk-build || true
