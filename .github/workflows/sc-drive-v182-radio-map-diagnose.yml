name: Diagnose SC Drive v1.8.2 Radio Maps

on:
  workflow_dispatch:
  push:
    branches: [ sc-drive-apk-build ]
    paths:
      - '.github/workflows/sc-drive-v182-radio-map-diagnose.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Reconstruct v1.8.1 UI polish
        shell: bash
        run: |
          set -euxo pipefail
          rm -f "$PUB_CACHE/credentials.json" "$HOME/.pub-cache/credentials.json" || true
          mkdir -p /tmp/scdrive-flutter-wrap
          cat > /tmp/scdrive-flutter-wrap/flutter <<'EOF'
          #!/usr/bin/env bash
          set -e
          REAL="${SC_DRIVE_REAL_FLUTTER:?}"
          if [[ "${1:-}" == "create" ]]; then shift; exec "$REAL" create --no-pub "$@"; fi
          if [[ "${1:-}" == "pub" && "${2:-}" == "get" ]]; then shift 2; exec "$REAL" pub get "$@"; fi
          exec "$REAL" "$@"
          EOF
          chmod +x /tmp/scdrive-flutter-wrap/flutter
          export SC_DRIVE_REAL_FLUTTER="$FLUTTER_ROOT/bin/flutter"
          export PATH="/tmp/scdrive-flutter-wrap:$PATH"
          run_step() {
            ruby -ryaml -e 'y=YAML.load_file(ARGV[0]); n=ARGV[1]; s=y["jobs"]["android"]["steps"].find{|x|x["name"]==n}; abort("missing #{n}") unless s&&s["run"]; print s["run"]' "$1" "$2" >/tmp/step.sh
            bash /tmp/step.sh
          }
          run_step .github/workflows/sc-drive-v181-ui-polish.yml 'Reconstruct verified v1.8.1 OpenVehicle base'
          run_step .github/workflows/sc-drive-v181-ui-polish.yml 'Apply v1.8.1 UI media typography polish delta'
      - name: Print radio and maps implementation
        shell: bash
        run: |
          set -euo pipefail
          echo '===== car_radio_service.dart ====='
          sed -n '1,260p' scdrive-app/lib/services/car_radio_service.dart || true
          echo '===== car_radio_panel.dart ====='
          sed -n '1,340p' scdrive-app/lib/features/head_unit/car_radio_panel.dart || true
          echo '===== MainActivity.kt ====='
          sed -n '1,360p' scdrive-app/android/app/src/main/kotlin/com/scdeport/scdrive/MainActivity.kt || true
          echo '===== AndroidManifest.xml ====='
          sed -n '1,260p' scdrive-app/android/app/src/main/AndroidManifest.xml || true
          echo '===== app build.gradle* ====='
          sed -n '1,340p' scdrive-app/android/app/build.gradle.kts 2>/dev/null || sed -n '1,340p' scdrive-app/android/app/build.gradle || true
          echo '===== maps references ====='
          grep -RniE 'GOOGLE_MAPS_API_KEY|com.google.android.geo.API_KEY|GoogleMap|mapsApiKey|MAPS_API' scdrive-app/android scdrive-app/lib | head -120 || true
