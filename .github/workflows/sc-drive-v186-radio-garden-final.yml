name: Build SC Drive v1.8.6 Radio Garden FINAL

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/sc-drive-v186-radio-garden-final.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sc-drive-v186-radio-garden-final
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sc-drive-apk-build
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Reconstruct exact v1.8.2 source
        shell: bash
        run: |
          set -euxo pipefail
          ruby -ryaml -e 'y=YAML.load_file(ARGV[0]); n=ARGV[1]; s=y["jobs"]["android-final"]["steps"].find{|x|x["name"]==n}; abort("missing #{n}") unless s&&s["run"]; print s["run"]' .github/workflows/sc-drive-v182-final-sign.yml 'Reconstruct exact v1.8.2 source' >/tmp/base.sh
          bash /tmp/base.sh
          grep -n '^version: 1.8.2+28' scdrive-app/pubspec.yaml
          (cd scdrive-app && sha256sum -c /tmp/v181-physics-authority.sha256)

      - name: Apply Camera Awareness and v1.8.4 hardening
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p scdrive-app/lib/features/camera
          cp build-assets/v183-camera/camera_models.dart scdrive-app/lib/features/camera/camera_models.dart
          cp build-assets/v183-camera/camera_repository.dart scdrive-app/lib/features/camera/camera_repository.dart
          cp build-assets/v183-camera/camera_awareness_service.dart scdrive-app/lib/features/camera/camera_awareness_service.dart
          patch -d scdrive-app -p1 --forward --batch < build-assets/v183-camera/drive-deck-camera.patch
          test -z "$(find scdrive-app -name '*.rej' -print -quit)"
          python3 - <<'PY'
          from pathlib import Path
          repo=Path('scdrive-app/lib/features/camera/camera_repository.dart')
          s=repo.read_text()
          old='if (_records.isEmpty || centerLat == null || centerLon == null || synced == null) {'
          new='if (centerLat == null || centerLon == null || synced == null) {'
          if old not in s: raise SystemExit('camera refresh gate not found')
          s=s.replace(old,new,1)
          needle='  node["enforcement"="maxspeed"](around:${_syncRadiusMeters.round()},$latitude,$longitude);\n'
          if needle not in s: raise SystemExit('camera query anchor not found')
          s=s.replace(needle,needle+'  node["enforcement"="traffic_signals"](around:${_syncRadiusMeters.round()},$latitude,$longitude);\n',1)
          repo.write_text(s)
          svc=Path('scdrive-app/lib/features/camera/camera_awareness_service.dart')
          s=svc.read_text()
          if 'const Duration(seconds: 30)' not in s: raise SystemExit('camera retry interval not found')
          svc.write_text(s.replace('const Duration(seconds: 30)','const Duration(minutes: 2)',1))
          PY

      - name: Apply v1.8.5 Drive Dynamics page 3
        shell: bash
        run: |
          set -euxo pipefail
          cp build-assets/v185-dynamics/drive_dynamics_panel.dart scdrive-app/lib/features/head_unit/drive_dynamics_panel.dart
          python3 - <<'PY'
          from pathlib import Path
          panel=Path('scdrive-app/lib/features/head_unit/drive_dynamics_panel.dart')
          s=panel.read_text()
          s=s.replace('builder: (context, constraints) {','builder: (context, _) {',1)
          s=s.replace('maxAbs = (maxAbs * 1.18).clamp(0.6, 1.5);','maxAbs = (maxAbs * 1.18).clamp(0.6, 1.5).toDouble();',1)
          s=s.replace("final alpha = (50 + ageFraction * 155).round().clamp(40, 220);","final alpha = (50 + ageFraction * 155).round().clamp(40, 220).toInt();",1)
          panel.write_text(s)

          deck=Path('scdrive-app/lib/features/head_unit/drive_deck_panel.dart')
          s=deck.read_text()
          anchor="import 'package:google_maps_flutter/google_maps_flutter.dart';\n"
          if anchor not in s: raise SystemExit('drive deck import anchor not found')
          s=s.replace(anchor,anchor+"\nimport 'drive_dynamics_panel.dart';\n",1)
          old="""            children: <Widget>[\n              _mapPage(),\n              _drivePage(),\n            ],"""
          new="""            children: <Widget>[\n              _mapPage(),\n              _drivePage(),\n              DriveDynamicsPanel(\n                telemetry: widget.telemetry,\n                compact: widget.compact,\n              ),\n            ],"""
          if old not in s: raise SystemExit('drive deck PageView children anchor not found')
          s=s.replace(old,new,1)
          dots="""                  Row(\n                    children: List<Widget>.generate(\n                      2,"""
          if dots not in s: raise SystemExit('drive deck page indicator anchor not found')
          s=s.replace(dots,"""                  Row(\n                    children: List<Widget>.generate(\n                      3,""",1)
          marker="""                    'DRIVE DATA',\n                    style: TextStyle(\n                      color: _page == 1"""
          if marker not in s: raise SystemExit('DRIVE DATA header anchor not found')
          s=s.replace(marker,"""                    'DRIVE DATA',\n                    style: TextStyle(\n                      color: _page >= 1""",1)
          deck.write_text(s)
          PY

      - name: Replace legacy radio page with Radio Garden companion
        shell: bash
        run: |
          set -euxo pipefail
          cp build-assets/v186-radio/radio_garden_panel.dart scdrive-app/lib/features/head_unit/radio_garden_panel.dart
          python3 - <<'PY'
          from pathlib import Path

          pub=Path('scdrive-app/pubspec.yaml')
          s=pub.read_text()
          if 'url_launcher:' not in s:
              if '\ndev_dependencies:' not in s: raise SystemExit('dev_dependencies anchor not found')
              s=s.replace('\ndev_dependencies:', '  url_launcher: ^6.3.2\n\ndev_dependencies:', 1)
          if 'version: 1.8.2+28' not in s: raise SystemExit('version baseline not found')
          s=s.replace('version: 1.8.2+28','version: 1.8.6+32',1)
          pub.write_text(s)

          screen=Path('scdrive-app/lib/features/head_unit/head_unit_screen.dart')
          s=screen.read_text()
          old="import 'car_radio_panel.dart';"
          if old not in s: raise SystemExit('legacy radio import not found')
          s=s.replace(old,"import 'radio_garden_panel.dart';",1)
          s=s.replace("                                      child: _MediaPager(\n                                        spotify: widget.spotify,\n                                        radio: widget.radio,\n                                        compact: compact,\n                                      ),",
                      "                                      child: _MediaPager(\n                                        spotify: widget.spotify,\n                                        compact: compact,\n                                      ),",1)
          s=s.replace("  const _MediaPager({\n    required this.spotify,\n    required this.radio,\n    required this.compact,\n  });",
                      "  const _MediaPager({\n    required this.spotify,\n    required this.compact,\n  });",1)
          s=s.replace("  final SpotifyService spotify;\n  final CarRadioService radio;\n  final bool compact;",
                      "  final SpotifyService spotify;\n  final bool compact;",1)
          old_panel="""            CarRadioPanel(\n              radio: widget.radio,\n              compact: widget.compact,\n            ),"""
          new_panel="""            RadioGardenPanel(\n              compact: widget.compact,\n            ),"""
          if old_panel not in s: raise SystemExit('CarRadioPanel anchor not found')
          s=s.replace(old_panel,new_panel,1)
          s=s.replace("? const Color(0xFF1ED760)\n                                : const Color(0xFFE72846)",
                      "? const Color(0xFF1ED760)\n                                : const Color(0xFF65D996)",1)
          screen.write_text(s)
          PY

      - name: Restore embedded Nissan Brand plus Thai glyph fonts
        shell: bash
        run: |
          set -euxo pipefail
          git fetch --depth=1 origin main
          git show origin/main:build-assets/v186-radio/nissanthai-fonts.tar.gz.b64 | base64 --decode > /tmp/nissanthai-fonts.tar.gz
          mkdir -p /tmp/nissanthai-fonts
          tar -xzf /tmp/nissanthai-fonts.tar.gz -C /tmp/nissanthai-fonts
          cp /tmp/nissanthai-fonts/NissanBrand-Regular.otf scdrive-app/assets/fonts/NissanBrand-Regular.otf
          cp /tmp/nissanthai-fonts/NissanBrand-Bold.otf scdrive-app/assets/fonts/NissanBrand-Bold.otf
          echo 'a784790a60d4ea4374727778591b75c352a5573c5b6be30472a7ca1f01f2fdd3  scdrive-app/assets/fonts/NissanBrand-Regular.otf' | sha256sum -c -
          echo 'fcb9f89140450674b8175c3d475b0f716c87c81033e38303f568b35ba2b9d4ab  scdrive-app/assets/fonts/NissanBrand-Bold.otf' | sha256sum -c -

      - name: Format and source gates
        shell: bash
        run: |
          set -euxo pipefail
          dart format \
            scdrive-app/lib/features/head_unit/radio_garden_panel.dart \
            scdrive-app/lib/features/head_unit/head_unit_screen.dart \
            scdrive-app/lib/features/head_unit/drive_dynamics_panel.dart \
            scdrive-app/lib/features/head_unit/drive_deck_panel.dart \
            scdrive-app/lib/features/camera/camera_repository.dart \
            scdrive-app/lib/features/camera/camera_awareness_service.dart
          grep -n '^version: 1.8.6+32' scdrive-app/pubspec.yaml
          grep -q 'url_launcher:' scdrive-app/pubspec.yaml
          grep -q 'RADIO GARDEN' scdrive-app/lib/features/head_unit/radio_garden_panel.dart
          grep -q 'RadioGardenPanel' scdrive-app/lib/features/head_unit/head_unit_screen.dart
          ! grep -q 'CarRadioPanel(' scdrive-app/lib/features/head_unit/head_unit_screen.dart
          grep -q 'G-G DIAGRAM' scdrive-app/lib/features/head_unit/drive_dynamics_panel.dart
          grep -q 'CAMERA AHEAD' scdrive-app/lib/features/head_unit/drive_deck_panel.dart
          grep -q '_digitalSpeed >= 100' scdrive-app/lib/features/head_unit/head_unit_screen.dart
          grep -q 'fit: BoxFit.scaleDown' scdrive-app/lib/features/head_unit/head_unit_screen.dart
          (cd scdrive-app && sha256sum -c /tmp/v181-physics-authority.sha256)

      - name: Require production Maps and permanent signing secrets
        shell: bash
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          SC_DRIVE_KEYSTORE_BASE64: ${{ secrets.SC_DRIVE_KEYSTORE_BASE64 }}
          SC_DRIVE_KEYSTORE_PASSWORD: ${{ secrets.SC_DRIVE_KEYSTORE_PASSWORD }}
          SC_DRIVE_KEY_PASSWORD: ${{ secrets.SC_DRIVE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in GOOGLE_MAPS_API_KEY SC_DRIVE_KEYSTORE_BASE64 SC_DRIVE_KEYSTORE_PASSWORD SC_DRIVE_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required repository secret: $name"
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Materialize permanent keystore
        shell: bash
        env:
          SC_DRIVE_KEYSTORE_BASE64: ${{ secrets.SC_DRIVE_KEYSTORE_BASE64 }}
          SC_DRIVE_KEYSTORE_PASSWORD: ${{ secrets.SC_DRIVE_KEYSTORE_PASSWORD }}
        run: |
          set -euxo pipefail
          KEYSTORE="$RUNNER_TEMP/scdrive-release.jks"
          printf '%s' "$SC_DRIVE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$SC_DRIVE_KEYSTORE_PASSWORD" -alias scdrive-release >/dev/null

      - name: Resolve dependencies
        working-directory: scdrive-app
        run: |
          rm -f "$PUB_CACHE/credentials.json" "$HOME/.pub-cache/credentials.json" || true
          flutter pub get

      - name: Android unit tests
        working-directory: scdrive-app/android
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          SC_DRIVE_ALLOW_TEST_SIGNING: '1'
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Strict Flutter analyze
        working-directory: scdrive-app
        run: flutter analyze --no-fatal-infos

      - name: Build FINAL release with permanent certificate
        working-directory: scdrive-app
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SC_DRIVE_KEYSTORE_PATH: ${{ runner.temp }}/scdrive-release.jks
          SC_DRIVE_KEYSTORE_PASSWORD: ${{ secrets.SC_DRIVE_KEYSTORE_PASSWORD }}
          SC_DRIVE_KEY_ALIAS: scdrive-release
          SC_DRIVE_KEY_PASSWORD: ${{ secrets.SC_DRIVE_KEY_PASSWORD }}
        run: |
          set -euxo pipefail
          unset SC_DRIVE_ALLOW_TEST_SIGNING || true
          flutter build apk --release \
            --dart-define=SPOTIFY_CLIENT_ID="${SPOTIFY_CLIENT_ID:-}" \
            --dart-define=SC_DRIVE_BUILD_PROFILE=production

      - name: Verify FINAL APK
        shell: bash
        env:
          EXPECTED_SIGNER_SHA256: BDF5DFEF877CC99B73436257830BD45DEDE314C41488DA480FA102553F836385
        run: |
          set -euxo pipefail
          APK=scdrive-app/build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -c -P 16 -v 4 "$APK" >/dev/null
          mkdir -p out
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee out/APKSIGNER-VERIFY.txt
          ACTUAL=$(sed -n 's/.*certificate SHA-256 digest: //p' out/APKSIGNER-VERIFY.txt | head -1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          test "$ACTUAL" = "$EXPECTED_SIGNER_SHA256"
          "$BT/aapt" dump badging "$APK" | tee out/AAPT-BADGING.txt
          grep -q "package: name='com.scdeport.scdrive'" out/AAPT-BADGING.txt
          grep -q "versionCode='32'" out/AAPT-BADGING.txt
          grep -q "versionName='1.8.6'" out/AAPT-BADGING.txt
          unzip -p "$APK" lib/arm64-v8a/libapp.so | strings | grep -F -m1 'RADIO GARDEN'
          unzip -p "$APK" lib/arm64-v8a/libapp.so | strings | grep -F -m1 'G-G DIAGRAM'
          unzip -p "$APK" lib/arm64-v8a/libapp.so | strings | grep -F -m1 'CAMERA AHEAD'
          unzip -p "$APK" classes.dex | strings | grep -F -m1 'SYSTEM_RADIO_APP'
          unzip -p "$APK" assets/flutter_assets/assets/fonts/NissanBrand-Regular.otf | sha256sum | grep -q '^a784790a60d4ea4374727778591b75c352a5573c5b6be30472a7ca1f01f2fdd3'
          unzip -p "$APK" assets/flutter_assets/assets/fonts/NissanBrand-Bold.otf | sha256sum | grep -q '^fcb9f89140450674b8175c3d475b0f716c87c81033e38303f568b35ba2b9d4ab'
          FINAL=out/SC_Drive-v1.8.6-Radio-Garden-Drive-Dynamics-NissanThai-PERMANENT-SIGNED.apk
          cp "$APK" "$FINAL"
          sha256sum "$FINAL" > out/SC_Drive-v1.8.6-SHA256.txt
          cat > out/SC_Drive-v1.8.6-FINAL-VERIFICATION.txt <<EOF
          SC Drive v1.8.6+32 Radio Garden FINAL
          Package: com.scdeport.scdrive
          Build profile: production
          Radio page: Radio Garden companion integration
          Legacy FM native bridge: retained in build as hidden fallback/future integration
          GPS Live Map: retained
          Google Maps production key injection: PASS
          Camera Awareness: retained
          Drive Data page 3 / G-G Diagram: retained
          Three-digit speed display up to 240 km/h: retained
          Nissan Brand + embedded Thai glyph runtime fonts: PASS
          Android unit tests: PASS
          Flutter analyze: PASS
          APK ZIP integrity: PASS
          16 KB zipalign: PASS
          APK signature verification: PASS
          Permanent signer SHA-256: $ACTUAL
          Physical head-unit validation: required for Radio Garden app-link handoff and background audio behavior.
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: SC-Drive-v1.8.6-Radio-Garden-FINAL-PERMANENT-SIGNED
          path: out/**
          if-no-files-found: error
          retention-days: 14

      - name: Publish build pointer
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin sc-drive-apk-build
          git checkout -B sc-drive-apk-build origin/sc-drive-apk-build
          mkdir -p build-status
          APK_SHA=''
          if [[ -f out/SC_Drive-v1.8.6-SHA256.txt ]]; then APK_SHA=$(cut -d' ' -f1 out/SC_Drive-v1.8.6-SHA256.txt); fi
          cat > build-status/sc-drive-v186-latest.txt <<EOF
          STATUS=${{ job.status }}
          RUN_ID=$GITHUB_RUN_ID
          SOURCE_SHA=$GITHUB_SHA
          ARTIFACT_NAME=SC-Drive-v1.8.6-Radio-Garden-FINAL-PERMANENT-SIGNED
          APK_NAME=SC_Drive-v1.8.6-Radio-Garden-Drive-Dynamics-NissanThai-PERMANENT-SIGNED.apk
          APK_SHA256=$APK_SHA
          EOF
          git config user.name 'SC Drive Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add build-status/sc-drive-v186-latest.txt
          git commit -m 'publish v1.8.6 Radio Garden build pointer [skip ci]' || true
          git push origin HEAD:sc-drive-apk-build || true

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/scdrive-release.jks"
