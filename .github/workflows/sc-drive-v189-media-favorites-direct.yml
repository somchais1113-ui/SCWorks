name: Build SC Drive v1.8.9 Media Favorites Direct

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/sc-drive-v189-media-favorites-direct.yml'
      - 'build-assets/v189/media_favorites_service.dart'
      - 'build-assets/v189/CompanionMediaBridge.kt'
      - 'build-assets/v189/patch-*.txt'
      - 'build-assets/v189/apply-v189.sh'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sc-drive-v189-media-favorites-direct
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sc-drive-apk-build
          fetch-depth: 1

      - name: Publish running pointer
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build-status
          cat > build-status/sc-drive-v189-direct-latest.txt <<EOF
          STATUS=running
          RUN_ID=$GITHUB_RUN_ID
          SOURCE_SHA=$GITHUB_SHA
          ARTIFACT_NAME=SC-Drive-v1.8.9-Media-Favorites-CANDIDATE
          APK_NAME=SC_Drive-v1.8.9-Media-Favorites-CANDIDATE.apk
          APK_SHA256=
          EOF
          git config user.name 'SC Drive Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add build-status/sc-drive-v189-direct-latest.txt
          git commit -m 'publish v1.8.9 direct running pointer [skip ci]' || true
          git push origin HEAD:sc-drive-apk-build || true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Reconstruct v1.8.8 latest baseline
        shell: bash
        run: |
          set -euxo pipefail
          git fetch --depth=1 origin main
          rm -rf "$PUB_CACHE/hosted/pub.dev/flutter_carplay-1.6.4" || true
          ruby -ryaml -e 'y=YAML.load_file(ARGV[0]); n=ARGV[1]; s=y["jobs"]["android-final"]["steps"].find{|x|x["name"]==n}; abort("missing #{n}") unless s&&s["run"]; print s["run"]' .github/workflows/sc-drive-v182-final-sign.yml 'Reconstruct exact v1.8.2 source' >/tmp/base.sh
          bash /tmp/base.sh
          git show origin/main:.github/workflows/sc-drive-v187-camera-awareness-latest.yml > /tmp/v187.yml
          ruby -ryaml -e 'y=YAML.load_file(ARGV[0]); n=ARGV[1]; s=y["jobs"]["android"]["steps"].find{|x|x["name"]==n}; abort("missing #{n}") unless s&&s["run"]; print s["run"]' /tmp/v187.yml 'Apply Camera Awareness and Drive Dynamics overlays' >/tmp/v187-camera-dynamics.sh
          bash /tmp/v187-camera-dynamics.sh
          ruby -ryaml -e 'y=YAML.load_file(ARGV[0]); n=ARGV[1]; s=y["jobs"]["android"]["steps"].find{|x|x["name"]==n}; abort("missing #{n}") unless s&&s["run"]; print s["run"]' /tmp/v187.yml 'Apply Radio Garden companion overlay' >/tmp/v187-radio.sh
          bash /tmp/v187-radio.sh
          ruby -ryaml -e 'y=YAML.load_file(ARGV[0]); n=ARGV[1]; s=y["jobs"]["android"]["steps"].find{|x|x["name"]==n}; abort("missing #{n}") unless s&&s["run"]; print s["run"]' /tmp/v187.yml 'Lock Camera Awareness into latest build and bump v1.8.7' >/tmp/v187-lock.sh
          bash /tmp/v187-lock.sh
          mkdir -p build-assets/v188
          git show origin/main:build-assets/v188/camera_awareness_service.dart > build-assets/v188/camera_awareness_service.dart
          git show origin/main:build-assets/v188/radio_garden_panel.dart > build-assets/v188/radio_garden_panel.dart
          git show origin/main:build-assets/v188/apply-v188.sh > build-assets/v188/apply-v188.sh
          chmod +x build-assets/v188/apply-v188.sh
          bash build-assets/v188/apply-v188.sh
          grep -n '^version: 1.8.8+34' scdrive-app/pubspec.yaml

      - name: Apply v1.8.9 local favorites and explicit companion launch
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build-assets/v189
          git show origin/main:build-assets/v189/media_favorites_service.dart > build-assets/v189/media_favorites_service.dart
          git show origin/main:build-assets/v189/CompanionMediaBridge.kt > build-assets/v189/CompanionMediaBridge.kt
          : > build-assets/v189/media-ui.patch
          for n in 00 01 02 03 04; do
            git show origin/main:build-assets/v189/patch-$n.txt >> build-assets/v189/media-ui.patch
          done
          git show origin/main:build-assets/v189/apply-v189.sh > build-assets/v189/apply-v189.sh
          chmod +x build-assets/v189/apply-v189.sh
          bash build-assets/v189/apply-v189.sh

      - name: Source gates
        shell: bash
        run: |
          set -euxo pipefail
          grep -n '^version: 1.8.9+35' scdrive-app/pubspec.yaml
          grep -q 'class CompanionMediaBridge' scdrive-app/android/app/src/main/kotlin/com/scdeport/scdrive/media/CompanionMediaBridge.kt
          grep -q 'setPackage(RADIO_GARDEN_PACKAGE)' scdrive-app/android/app/src/main/kotlin/com/scdeport/scdrive/media/CompanionMediaBridge.kt
          grep -q 'setPackage(SPOTIFY_PACKAGE)' scdrive-app/android/app/src/main/kotlin/com/scdeport/scdrive/media/CompanionMediaBridge.kt
          grep -q 'SC DRIVE RADIO FAVORITES' scdrive-app/lib/features/head_unit/radio_garden_panel.dart
          grep -q 'SPOTIFY LIBRARY' scdrive-app/lib/features/head_unit/head_unit_screen.dart
          grep -q 'playPlaylist' scdrive-app/lib/services/spotify_service.dart
          grep -q 'playTrack' scdrive-app/lib/services/spotify_service.dart
          grep -q 'CAMERA AHEAD' scdrive-app/lib/features/head_unit/drive_deck_panel.dart
          grep -q 'G-G DIAGRAM' scdrive-app/lib/features/head_unit/drive_dynamics_panel.dart
          grep -q '_digitalSpeed >= 100' scdrive-app/lib/features/head_unit/head_unit_screen.dart
          grep -q 'fit: BoxFit.scaleDown' scdrive-app/lib/features/head_unit/head_unit_screen.dart
          (cd scdrive-app && sha256sum -c /tmp/v181-physics-authority.sha256)

      - name: Require production Google Maps key
        shell: bash
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${GOOGLE_MAPS_API_KEY:-}"
          echo 'Production Google Maps key present.'

      - name: Resolve dependencies
        working-directory: scdrive-app
        run: |
          rm -f "$PUB_CACHE/credentials.json" "$HOME/.pub-cache/credentials.json" || true
          flutter pub get

      - name: Android unit tests
        working-directory: scdrive-app/android
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          SC_DRIVE_ALLOW_TEST_SIGNING: '1'
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Strict Flutter analyze
        working-directory: scdrive-app
        run: flutter analyze --no-fatal-infos

      - name: Build release candidate with production Maps
        working-directory: scdrive-app
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SC_DRIVE_ALLOW_TEST_SIGNING: '1'
        run: |
          set -euxo pipefail
          flutter build apk --release \
            --dart-define=SPOTIFY_CLIENT_ID="${SPOTIFY_CLIENT_ID:-}" \
            --dart-define=SC_DRIVE_BUILD_PROFILE=production

      - name: Verify and package candidate plus finalization tools
        shell: bash
        run: |
          set -euxo pipefail
          APK=scdrive-app/build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -c -P 16 -v 4 "$APK" >/dev/null
          mkdir -p out/build-tools/lib
          cp "$APK" out/SC_Drive-v1.8.9-Media-Favorites-CANDIDATE.apk
          cp "$BT/zipalign" out/build-tools/zipalign
          cp "$BT/apksigner" out/build-tools/apksigner
          cp "$BT/lib/apksigner.jar" out/build-tools/lib/apksigner.jar
          cp "$BT/aapt" out/build-tools/aapt
          chmod +x out/build-tools/zipalign out/build-tools/apksigner out/build-tools/aapt
          "$BT/aapt" dump badging "$APK" | tee out/AAPT-BADGING.txt
          grep -q "package: name='com.scdeport.scdrive'" out/AAPT-BADGING.txt
          grep -q "versionCode='35'" out/AAPT-BADGING.txt
          grep -q "versionName='1.8.9'" out/AAPT-BADGING.txt
          unzip -p "$APK" classes.dex | strings | grep -F -m1 'com.spotify.music'
          unzip -p "$APK" classes.dex | strings | grep -F -m1 'com.jonathanpuckey.radiogarden'
          unzip -p "$APK" classes.dex | strings | grep -F -m1 'companion_media_control'
          cat > out/V189-FEATURE-VERIFICATION.txt <<EOF
          SC Drive v1.8.9+35
          Radio Garden SC Drive favorites: INCLUDED
          Radio Garden ACTION_SEND import: INCLUDED
          Radio Garden explicit package launch/no browser fallback: INCLUDED
          Spotify explicit package launch/no browser fallback: INCLUDED
          Spotify in-app playlists + recent library: INCLUDED
          Spotify Web API direct playlist/track playback: INCLUDED
          Spotify/Radio last target memory: INCLUDED
          Camera confidence + road corridor: PRESERVED
          Drive Dynamics page 3: PRESERVED
          Physics authority checksum: PASS
          Production Google Maps key gate: PASS
          Android tests: PASS if artifact exists
          Flutter analyze: PASS if artifact exists
          Physical head-unit validation: REQUIRED
          EOF
          sha256sum out/SC_Drive-v1.8.9-Media-Favorites-CANDIDATE.apk > out/CANDIDATE.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: SC-Drive-v1.8.9-Media-Favorites-CANDIDATE
          path: out/**
          if-no-files-found: error
          retention-days: 14

      - name: Publish final pointer
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin sc-drive-apk-build
          git checkout -B sc-drive-apk-build origin/sc-drive-apk-build
          mkdir -p build-status
          APK_SHA=''
          if [[ -f out/CANDIDATE.sha256 ]]; then APK_SHA=$(cut -d' ' -f1 out/CANDIDATE.sha256); fi
          cat > build-status/sc-drive-v189-direct-latest.txt <<EOF
          STATUS=${{ job.status }}
          RUN_ID=$GITHUB_RUN_ID
          SOURCE_SHA=$GITHUB_SHA
          ARTIFACT_NAME=SC-Drive-v1.8.9-Media-Favorites-CANDIDATE
          APK_NAME=SC_Drive-v1.8.9-Media-Favorites-CANDIDATE.apk
          APK_SHA256=$APK_SHA
          EOF
          git config user.name 'SC Drive Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add build-status/sc-drive-v189-direct-latest.txt
          git commit -m 'publish v1.8.9 direct candidate pointer [skip ci]' || true
          git push origin HEAD:sc-drive-apk-build || true
