name: Build SC Drive v1.9.0 Dynamics Top Tab R2

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/sc-drive-v190-dynamics-top-r2.yml'
      - 'build-assets/v190/drive_dynamics_panel.dart'
      - 'build-assets/v190/apply-v190.sh'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sc-drive-v190-dynamics-top-r2
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sc-drive-apk-build
          fetch-depth: 1

      - name: Publish running pointer
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build-status
          cat > build-status/sc-drive-v190-r2-latest.txt <<EOF
          STATUS=running
          RUN_ID=$GITHUB_RUN_ID
          SOURCE_SHA=$GITHUB_SHA
          ARTIFACT_NAME=SC-Drive-v1.9.0-Dynamics-Top-Tab-R2-CANDIDATE
          APK_NAME=SC_Drive-v1.9.0-Dynamics-Top-Tab-R2-CANDIDATE.apk
          APK_SHA256=
          EOF
          git config user.name 'SC Drive Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add build-status/sc-drive-v190-r2-latest.txt
          git commit -m 'publish v1.9.0 r2 running pointer [skip ci]' || true
          git push origin HEAD:sc-drive-apk-build || true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Reconstruct v1.8.8 source
        shell: bash
        run: |
          set -euxo pipefail
          git fetch --depth=1 origin main
          git show origin/main:.github/workflows/sc-drive-v189-inspect-media.yml > /tmp/inspect-v188.yml
          ruby -ryaml -e 'y=YAML.load_file(ARGV[0]); n=ARGV[1]; s=y["jobs"]["inspect"]["steps"].find{|x|x["name"]==n}; abort("missing #{n}") unless s&&s["run"]; print s["run"]' /tmp/inspect-v188.yml 'Reconstruct v1.8.8 source' >/tmp/reconstruct-v188.sh
          bash /tmp/reconstruct-v188.sh
          grep -n '^version: 1.8.8+34' scdrive-app/pubspec.yaml

      - name: Apply responsive Drive Dynamics top tab
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build-assets/v190
          git show origin/main:build-assets/v190/drive_dynamics_panel.dart > build-assets/v190/drive_dynamics_panel.dart
          git show origin/main:build-assets/v190/apply-v190.sh > build-assets/v190/apply-v190.sh
          chmod +x build-assets/v190/apply-v190.sh
          bash build-assets/v190/apply-v190.sh

      - name: Source gates
        shell: bash
        run: |
          set -euxo pipefail
          grep -n '^version: 1.9.0+35' scdrive-app/pubspec.yaml
          grep -q 'LONGITUDINAL G' scdrive-app/lib/features/head_unit/drive_dynamics_panel.dart
          grep -q 'LATERAL G' scdrive-app/lib/features/head_unit/drive_dynamics_panel.dart
          grep -q 'COMBINED G' scdrive-app/lib/features/head_unit/drive_dynamics_panel.dart
          grep -q 'PEAK G' scdrive-app/lib/features/head_unit/drive_dynamics_panel.dart
          grep -q '30 FPS' scdrive-app/lib/features/head_unit/drive_dynamics_panel.dart
          grep -q 'Duration(milliseconds: 33)' scdrive-app/lib/features/head_unit/drive_dynamics_panel.dart
          grep -q 'response = 0.72' scdrive-app/lib/features/head_unit/drive_dynamics_panel.dart
          grep -q 'TIME · LAST 20 SEC' scdrive-app/lib/features/head_unit/drive_dynamics_panel.dart
          grep -q 'DriveDynamicsPanel' scdrive-app/lib/features/head_unit/head_unit_screen.dart
          grep -q 'List<Widget>.generate(3' scdrive-app/lib/features/head_unit/head_unit_screen.dart
          if grep -q 'DriveDynamicsPanel' scdrive-app/lib/features/head_unit/drive_deck_panel.dart; then exit 9; fi
          grep -q 'CAMERA AHEAD' scdrive-app/lib/features/head_unit/drive_deck_panel.dart
          grep -q 'RadioGardenMediaSessionBridge' scdrive-app/android/app/src/main/kotlin/com/scdeport/scdrive/MainActivity.kt
          (cd scdrive-app && sha256sum -c /tmp/v181-physics-authority.sha256)

      - name: Require production Google Maps key
        shell: bash
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${GOOGLE_MAPS_API_KEY:-}"
          echo 'Production Google Maps key present.'

      - name: Resolve dependencies
        working-directory: scdrive-app
        run: |
          rm -f "$PUB_CACHE/credentials.json" "$HOME/.pub-cache/credentials.json" || true
          flutter pub get

      - name: Android unit tests
        working-directory: scdrive-app/android
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          SC_DRIVE_ALLOW_TEST_SIGNING: '1'
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Strict Flutter analyze
        working-directory: scdrive-app
        run: flutter analyze --no-fatal-infos

      - name: Build release candidate
        working-directory: scdrive-app
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SC_DRIVE_ALLOW_TEST_SIGNING: '1'
        run: |
          set -euxo pipefail
          flutter build apk --release \
            --dart-define=SPOTIFY_CLIENT_ID="${SPOTIFY_CLIENT_ID:-}" \
            --dart-define=SC_DRIVE_BUILD_PROFILE=production

      - name: Verify and package candidate
        shell: bash
        run: |
          set -euxo pipefail
          APK=scdrive-app/build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -c -P 16 -v 4 "$APK" >/dev/null
          mkdir -p out/build-tools/lib
          cp "$APK" out/SC_Drive-v1.9.0-Dynamics-Top-Tab-R2-CANDIDATE.apk
          cp "$BT/zipalign" out/build-tools/zipalign
          cp "$BT/apksigner" out/build-tools/apksigner
          cp "$BT/lib/apksigner.jar" out/build-tools/lib/apksigner.jar
          cp "$BT/aapt" out/build-tools/aapt
          chmod +x out/build-tools/zipalign out/build-tools/apksigner out/build-tools/aapt
          unzip -p "$APK" lib/arm64-v8a/libapp.so | strings | grep -F -m1 'COMBINED G'
          unzip -p "$APK" lib/arm64-v8a/libapp.so | strings | grep -F -m1 'SPEED TRACE'
          unzip -p "$APK" lib/arm64-v8a/libapp.so | strings | grep -F -m1 'CAMERA AHEAD'
          unzip -p "$APK" lib/arm64-v8a/libapp.so | strings | grep -F -m1 'RADIO GARDEN'
          "$BT/aapt" dump badging "$APK" | tee out/AAPT-BADGING.txt
          grep -q "package: name='com.scdeport.scdrive'" out/AAPT-BADGING.txt
          grep -q "versionCode='35'" out/AAPT-BADGING.txt
          grep -q "versionName='1.9.0'" out/AAPT-BADGING.txt
          cat > out/V190-FEATURE-VERIFICATION.txt <<EOF
          SC Drive v1.9.0+35
          Top pager order: Spotify -> Radio Garden -> Drive Dynamics
          Lower DriveDeck restored to Map + Drive Data only
          Longitudinal/Lateral G: responsive realtime display
          Combined G: realtime vector magnitude
          Peak G: combined peak for current panel session
          UI target render cadence: 33 ms (~30 FPS)
          G response blend: 0.72
          Speed trace sampling: 50 ms
          Speed trace window: 20 sec
          Adaptive speed Y ceiling: 40-240 km/h
          Camera Awareness: PRESERVED
          Radio Garden MediaSession: PRESERVED
          Physics authority checksum: PASS
          Production Maps key gate: PASS
          Physical head-unit validation: REQUIRED
          EOF
          sha256sum out/SC_Drive-v1.9.0-Dynamics-Top-Tab-R2-CANDIDATE.apk > out/CANDIDATE.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: SC-Drive-v1.9.0-Dynamics-Top-Tab-R2-CANDIDATE
          path: out/**
          if-no-files-found: error
          retention-days: 14

      - name: Publish final pointer
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin sc-drive-apk-build
          git checkout -B sc-drive-apk-build origin/sc-drive-apk-build
          mkdir -p build-status
          APK_SHA=''
          if [[ -f out/CANDIDATE.sha256 ]]; then APK_SHA=$(cut -d' ' -f1 out/CANDIDATE.sha256); fi
          cat > build-status/sc-drive-v190-r2-latest.txt <<EOF
          STATUS=${{ job.status }}
          RUN_ID=$GITHUB_RUN_ID
          SOURCE_SHA=$GITHUB_SHA
          ARTIFACT_NAME=SC-Drive-v1.9.0-Dynamics-Top-Tab-R2-CANDIDATE
          APK_NAME=SC_Drive-v1.9.0-Dynamics-Top-Tab-R2-CANDIDATE.apk
          APK_SHA256=$APK_SHA
          EOF
          git config user.name 'SC Drive Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add build-status/sc-drive-v190-r2-latest.txt
          git commit -m 'publish v1.9.0 r2 candidate pointer [skip ci]' || true
          git push origin HEAD:sc-drive-apk-build || true
