name: Build SC Drive v1.8.7 Camera Awareness Latest

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/sc-drive-v187-camera-awareness-latest.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sc-drive-v187-camera-awareness-latest
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sc-drive-apk-build
          fetch-depth: 1

      - name: Publish running pointer
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build-status
          cat > build-status/sc-drive-v187-latest.txt <<EOF
          STATUS=running
          RUN_ID=$GITHUB_RUN_ID
          SOURCE_SHA=$GITHUB_SHA
          ARTIFACT_NAME=SC-Drive-v1.8.7-Camera-Awareness-LATEST-CANDIDATE
          APK_NAME=SC_Drive-v1.8.7-Camera-Awareness-LATEST-CANDIDATE.apk
          APK_SHA256=
          EOF
          git config user.name 'SC Drive Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add build-status/sc-drive-v187-latest.txt
          git commit -m 'publish v1.8.7 running pointer [skip ci]' || true
          git push origin HEAD:sc-drive-apk-build || true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Reconstruct exact v1.8.2 source robustly
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf "$PUB_CACHE/hosted/pub.dev/flutter_carplay-1.6.4" || true
          ruby -ryaml -e 'y=YAML.load_file(ARGV[0]); n=ARGV[1]; s=y["jobs"]["android-final"]["steps"].find{|x|x["name"]==n}; abort("missing #{n}") unless s&&s["run"]; print s["run"]' .github/workflows/sc-drive-v182-final-sign.yml 'Reconstruct exact v1.8.2 source' >/tmp/base.sh
          bash /tmp/base.sh
          grep -n '^version: 1.8.2+28' scdrive-app/pubspec.yaml
          (cd scdrive-app && sha256sum -c /tmp/v181-physics-authority.sha256)

      - name: Apply Camera Awareness and Drive Dynamics overlays
        shell: bash
        run: |
          set -euxo pipefail
          git fetch --depth=1 origin main
          git show origin/main:.github/workflows/sc-drive-v185-dynamics-main.yml > /tmp/v185.yml
          ruby -ryaml -e 'y=YAML.load_file(ARGV[0]); n=ARGV[1]; s=y["jobs"]["android"]["steps"].find{|x|x["name"]==n}; abort("missing #{n}") unless s&&s["run"]; print s["run"]' /tmp/v185.yml 'Apply Camera Awareness and v1.8.4 hardening' >/tmp/v185-camera.sh
          bash /tmp/v185-camera.sh
          ruby -ryaml -e 'y=YAML.load_file(ARGV[0]); n=ARGV[1]; s=y["jobs"]["android"]["steps"].find{|x|x["name"]==n}; abort("missing #{n}") unless s&&s["run"]; print s["run"]' /tmp/v185.yml 'Add Drive Data page 3 realtime dynamics' >/tmp/v185-dynamics.sh
          bash /tmp/v185-dynamics.sh
          grep -n '^version: 1.8.5+31' scdrive-app/pubspec.yaml

      - name: Apply Radio Garden companion overlay
        shell: bash
        run: bash build-assets/v186-radio/apply-radio-garden.sh

      - name: Lock Camera Awareness into latest build and bump v1.8.7
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          pub = Path('scdrive-app/pubspec.yaml')
          s = pub.read_text()
          if 'version: 1.8.6+32' not in s:
              raise SystemExit('v1.8.6 baseline missing')
          pub.write_text(s.replace('version: 1.8.6+32', 'version: 1.8.7+33', 1))
          PY
          test -f scdrive-app/lib/features/camera/camera_models.dart
          test -f scdrive-app/lib/features/camera/camera_repository.dart
          test -f scdrive-app/lib/features/camera/camera_awareness_service.dart
          grep -q 'CAMERA AHEAD' scdrive-app/lib/features/head_unit/drive_deck_panel.dart
          grep -q 'CAMERA PASSED' scdrive-app/lib/features/head_unit/drive_deck_panel.dart
          grep -q 'highway.*speed_camera' scdrive-app/lib/features/camera/camera_repository.dart
          grep -q 'enforcement.*maxspeed' scdrive-app/lib/features/camera/camera_repository.dart
          grep -q 'enforcement.*traffic_signals' scdrive-app/lib/features/camera/camera_repository.dart
          grep -q 'sc_drive_camera_cache_v1' scdrive-app/lib/features/camera/camera_repository.dart
          grep -n '^version: 1.8.7+33' scdrive-app/pubspec.yaml

      - name: Source gates
        shell: bash
        run: |
          set -euxo pipefail
          grep -n '^version: 1.8.7+33' scdrive-app/pubspec.yaml
          grep -q 'url_launcher:' scdrive-app/pubspec.yaml
          grep -q 'RADIO GARDEN' scdrive-app/lib/features/head_unit/radio_garden_panel.dart
          grep -q 'RadioGardenPanel' scdrive-app/lib/features/head_unit/head_unit_screen.dart
          ! grep -q 'CarRadioPanel(' scdrive-app/lib/features/head_unit/head_unit_screen.dart
          grep -q 'G-G DIAGRAM' scdrive-app/lib/features/head_unit/drive_dynamics_panel.dart
          grep -q 'CAMERA AHEAD' scdrive-app/lib/features/head_unit/drive_deck_panel.dart
          grep -q '_digitalSpeed >= 100' scdrive-app/lib/features/head_unit/head_unit_screen.dart
          grep -q 'fit: BoxFit.scaleDown' scdrive-app/lib/features/head_unit/head_unit_screen.dart
          (cd scdrive-app && sha256sum -c /tmp/v181-physics-authority.sha256)

      - name: Require production Google Maps key
        shell: bash
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${GOOGLE_MAPS_API_KEY:-}"
          echo 'Production Google Maps key present.'

      - name: Resolve dependencies
        working-directory: scdrive-app
        run: |
          rm -f "$PUB_CACHE/credentials.json" "$HOME/.pub-cache/credentials.json" || true
          flutter pub get

      - name: Android unit tests
        working-directory: scdrive-app/android
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          SC_DRIVE_ALLOW_TEST_SIGNING: '1'
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Strict Flutter analyze
        working-directory: scdrive-app
        run: flutter analyze --no-fatal-infos

      - name: Build release candidate with production Maps
        working-directory: scdrive-app
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SC_DRIVE_ALLOW_TEST_SIGNING: '1'
        run: |
          set -euxo pipefail
          flutter build apk --release \
            --dart-define=SPOTIFY_CLIENT_ID="${SPOTIFY_CLIENT_ID:-}" \
            --dart-define=SC_DRIVE_BUILD_PROFILE=production

      - name: Verify and package candidate plus finalization tools
        shell: bash
        run: |
          set -euxo pipefail
          APK=scdrive-app/build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -c -P 16 -v 4 "$APK" >/dev/null
          mkdir -p out/build-tools/lib
          cp "$APK" out/SC_Drive-v1.8.7-Camera-Awareness-LATEST-CANDIDATE.apk
          cp "$BT/zipalign" out/build-tools/zipalign
          cp "$BT/apksigner" out/build-tools/apksigner
          cp "$BT/lib/apksigner.jar" out/build-tools/lib/apksigner.jar
          cp "$BT/aapt" out/build-tools/aapt
          chmod +x out/build-tools/zipalign out/build-tools/apksigner out/build-tools/aapt
          unzip -p "$APK" lib/arm64-v8a/libapp.so | strings | grep -F -m1 'RADIO GARDEN'
          unzip -p "$APK" lib/arm64-v8a/libapp.so | strings | grep -F -m1 'G-G DIAGRAM'
          unzip -p "$APK" lib/arm64-v8a/libapp.so | strings | grep -F -m1 'CAMERA AHEAD'
          unzip -p "$APK" lib/arm64-v8a/libapp.so | strings | grep -F -m1 'CAMERA PASSED'
          unzip -p "$APK" lib/arm64-v8a/libapp.so | strings | grep -F -m1 'speed_camera'
          unzip -p "$APK" lib/arm64-v8a/libapp.so | strings | grep -F -m1 'enforcement' 
          unzip -p "$APK" classes.dex | strings | grep -F -m1 'SYSTEM_RADIO_APP'
          "$BT/aapt" dump badging "$APK" | tee out/AAPT-BADGING.txt
          grep -q "package: name='com.scdeport.scdrive'" out/AAPT-BADGING.txt
          grep -q "versionCode='33'" out/AAPT-BADGING.txt
          grep -q "versionName='1.8.7'" out/AAPT-BADGING.txt
          {
            echo 'SC DRIVE v1.8.7 CAMERA FEATURE PARITY'
            echo 'Camera models: OK'
            echo 'Camera repository: OK'
            echo 'Camera awareness service: OK'
            echo 'Speed camera OSM query: OK'
            echo 'Maxspeed enforcement query: OK'
            echo 'Traffic signal enforcement hardening: OK'
            echo 'CAMERA AHEAD overlay: OK'
            echo 'CAMERA PASSED state: OK'
            echo 'Camera local cache: OK'
          } > out/CAMERA-FEATURE-PARITY.txt
          sha256sum out/SC_Drive-v1.8.7-Camera-Awareness-LATEST-CANDIDATE.apk > out/CANDIDATE.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: SC-Drive-v1.8.7-Camera-Awareness-LATEST-CANDIDATE
          path: out/**
          if-no-files-found: error
          retention-days: 14

      - name: Publish final pointer
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin sc-drive-apk-build
          git checkout -B sc-drive-apk-build origin/sc-drive-apk-build
          mkdir -p build-status
          APK_SHA=''
          if [[ -f out/CANDIDATE.sha256 ]]; then APK_SHA=$(cut -d' ' -f1 out/CANDIDATE.sha256); fi
          cat > build-status/sc-drive-v187-latest.txt <<EOF
          STATUS=${{ job.status }}
          RUN_ID=$GITHUB_RUN_ID
          SOURCE_SHA=$GITHUB_SHA
          ARTIFACT_NAME=SC-Drive-v1.8.7-Camera-Awareness-LATEST-CANDIDATE
          APK_NAME=SC_Drive-v1.8.7-Camera-Awareness-LATEST-CANDIDATE.apk
          APK_SHA256=$APK_SHA
          EOF
          git config user.name 'SC Drive Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add build-status/sc-drive-v187-latest.txt
          git commit -m 'publish v1.8.7 candidate pointer [skip ci]' || true
          git push origin HEAD:sc-drive-apk-build || true
