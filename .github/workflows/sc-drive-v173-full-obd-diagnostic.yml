name: Build SC Drive v1.7.3 Comprehensive OBD Diagnostic

on:
  push:
    branches: [ sc-drive-apk-build ]
    paths:
      - '.github/workflows/sc-drive-v173-full-obd-diagnostic.yml'
      - 'build-assets/v173-full-obd-diagnostic-s/**'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Reconstruct verified v1.7.2 base
        shell: bash
        run: |
          set -euxo pipefail
          run_v172_step() {
            ruby -ryaml -e 'y=YAML.load_file(ARGV[0]); n=ARGV[1]; s=y["jobs"]["android"]["steps"].find{|x|x["name"]==n}; abort("missing #{n}") unless s&&s["run"]; print s["run"]' .github/workflows/sc-drive-v172-obd-probe-v2.yml "$1" >/tmp/v172-step.sh
            bash /tmp/v172-step.sh
          }
          run_v172_step 'Reconstruct verified v1.7.0 base'
          run_v172_step 'Apply OBD Hardware Probe V2'
          grep -n '^version: 1.7.2+22' scdrive-app/pubspec.yaml

      - name: Apply comprehensive diagnostic V3 overlay
        shell: bash
        run: |
          set -euxo pipefail
          cat build-assets/v173-full-obd-diagnostic-s/{00,01,02,03,04,05,06,07}.b64 > /tmp/v173.b64
          echo 'ac445e90e88534f66929ba2a87a9dd326ff53ab2d999b30338f199d42cd5ec66  /tmp/v173.b64' | sha256sum -c -
          base64 -d /tmp/v173.b64 > /tmp/v173.tar.gz
          echo '5aa9d5b47c7cf5a004c65eda3af63c34b4170efc667801998d6807415e56fe19  /tmp/v173.tar.gz' | sha256sum -c -
          tar -xzf /tmp/v173.tar.gz -C scdrive-app
          cd scdrive-app
          # CI-only placeholder font bytes. User-provided Nissan Brand binaries are never committed.
          cp assets/fonts/NissanOpti.otf assets/fonts/NissanBrand-Regular.otf
          cp assets/fonts/NissanOpti.otf assets/fonts/NissanBrand-Bold.otf
          dart format lib/services/obd_service.dart lib/models/obd_state.dart lib/features/head_unit/head_unit_screen.dart lib/features/head_unit/drive_deck_panel.dart lib/app/app.dart
          grep -n '^version: 1.7.3+23' pubspec.yaml
          grep -n "family: NissanBrand" pubspec.yaml
          grep -n 'GENERIC_OBD_VERIFIED' android/app/src/main/kotlin/com/scdeport/scdrive/obd/ObdProbeModels.kt
          grep -n 'ATSH7DF' android/app/src/main/kotlin/com/scdeport/scdrive/obd/ObdManager.kt
          grep -n 'RUN FULL OBD DIAGNOSTIC' lib/features/head_unit/head_unit_screen.dart

      - name: Resolve dependencies
        working-directory: scdrive-app
        run: flutter pub get

      - name: Apply safe Dart analyzer fixes
        working-directory: scdrive-app
        run: dart fix --apply

      - name: Strict Flutter analyze
        working-directory: scdrive-app
        run: flutter analyze

      - name: Build release candidate
        working-directory: scdrive-app
        env:
          GOOGLE_MAPS_API_KEY: AIza00000000000000000000000000000000000
          SC_DRIVE_ALLOW_TEST_SIGNING: '1'
        run: |
          set -euxo pipefail
          flutter build apk --release --dart-define=SC_DRIVE_BUILD_PROFILE=production

      - name: Verify candidate
        shell: bash
        run: |
          set -euxo pipefail
          APK=scdrive-app/build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -c -P 16 -v 4 "$APK" >/dev/null
          unzip -l "$APK" | grep 'assets/flutter_assets/assets/fonts/NissanBrand-Regular.otf'
          unzip -l "$APK" | grep 'assets/flutter_assets/assets/fonts/NissanBrand-Bold.otf'
          mkdir -p out/lib
          cp "$APK" out/SC_Drive-v1.7.3-OBD-Comprehensive-Diagnostic-V3-CANDIDATE.apk
          cp "$BT/apksigner" out/apksigner
          cp "$BT/zipalign" out/zipalign
          cp "$BT/lib/apksigner.jar" out/lib/apksigner.jar
          chmod +x out/apksigner out/zipalign
          sha256sum "$APK" > out/candidate.sha256
          cat > out/BUILD-VERIFICATION.txt <<'EOF'
          SC Drive v1.7.3+23 Comprehensive OBD Diagnostic V3
          Flutter analyze: PASS
          Release build: PASS
          APK ZIP integrity: PASS
          16 KB zipalign: PASS
          Comprehensive read-only OBD diagnostic: ENABLED
          Functional CAN and dynamically-derived physical diagnostic passes: ENABLED
          Mode 04 / ECU writes / actuator commands / arbitrary CAN injection: NOT IMPLEMENTED
          OBD speed fusion: NOT ENABLED; GPS + IMU remains authoritative until PID 010D is verified.
          CI contains placeholder font bytes only. User-provided Nissan Brand Regular/Bold are injected locally before permanent signing.
          CI contains placeholder Maps configuration only. Production deployment configuration is injected locally before permanent signing.
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: SC-Drive-v1.7.3-OBD-Comprehensive-Diagnostic-V3-CANDIDATE
          path: out/**
          if-no-files-found: error
          retention-days: 7
